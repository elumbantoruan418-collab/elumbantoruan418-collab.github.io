<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR TERMINAL PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0f19; --card: #151c2c; --primary: #38bdf8; --text: #ffffff; 
            --dim: #94a3b8; --accent: #10b981; 
            --msg-me-bg: #ffffff; --msg-me-text: #0b0f19;
            --msg-others-bg: #061a14; --msg-others-text: #34d399;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; width: 100%; overflow: hidden; position: fixed; }
        
        .screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(56, 189, 248, 0.1); }
        
        input[type="text"] { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #2d3748; background: #0b0f19; color: white; margin-bottom: 15px; outline: none; }
        .btn { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; font-family: 'Rajdhani'; letter-spacing: 1px; }

        #app { display: none; flex-direction: column; height: 100vh; width: 100%; position: relative; }
        
        /* Navigasi Bawah Fix */
        .nav-bottom { 
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 70px; background: var(--card); display: flex; 
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        #listView { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .header-ui { padding: 15px; background: var(--card); }
        
        .user-list-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .user-avatar { width: 45px; height: 45px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; }

        /* Chat Window */
        #chatView { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: none; flex-direction: column; }
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }
        
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; position: relative; word-wrap: break-word; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; }
        .msg.me { align-self: flex-end; background: var(--msg-me-bg); color: var(--msg-me-text); }
        .msg.others { align-self: flex-start; background: var(--msg-others-bg); color: var(--msg-others-text); }

        .input-bar { position: absolute; bottom: 0; width: 100%; padding: 10px; background: var(--card); display: flex; gap: 10px; align-items: center; }
        .file-label { color: var(--primary); font-size: 24px; cursor: pointer; }
        
        .hidden { display: none !important; }
        .badge { font-size: 9px; background: var(--accent); color: #000; padding: 2px 5px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="screen">
        <div class="box">
            <h2 style="font-family:'Rajdhani'; margin-bottom:20px;">WINZ XTR GATE</h2>
            <input type="text" id="idIn" placeholder="Enter Your ID...">
            <button class="btn" onclick="register()">LOGIN TERMINAL</button>
        </div>
    </div>

    <div id="app">
        <div id="searchView" class="header-ui hidden">
            <input type="text" id="searchIn" placeholder="Tambah ID Teman..." style="margin-bottom:0; padding:10px;">
            <button class="btn" onclick="findUser()" style="margin-top:10px; padding:10px;">TAMBAH</button>
        </div>

        <div id="listView"></div>

        <div class="nav-bottom">
            <div id="nav-chats" class="nav-item active" onclick="showSection('chats')"><i class="fas fa-comment"></i>Chats</div>
            <div id="nav-contacts" class="nav-item" onclick="showSection('contacts')"><i class="fas fa-user-friends"></i>Kontak</div>
            <div id="nav-logout" class="nav-item" onclick="logout()"><i class="fas fa-power-off"></i>Logout</div>
        </div>
    </div>

    <div id="chatView">
        <div class="header-ui" style="display:flex; align-items:center; gap:15px;">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <div id="chatTargetName" style="font-family:'Rajdhani'; flex:1;">User</div>
            <div id="targetBadge"></div>
        </div>
        <div id="msgArea"></div>
        <div class="input-bar">
            <label class="file-label"><i class="fas fa-plus-circle"></i><input type="file" id="fileIn" class="hidden" onchange="sendFile()"></label>
            <input type="text" id="msgIn" placeholder="Pesan..." style="margin-bottom:0;">
            <i class="fas fa-paper-plane" onclick="sendText()" style="color:var(--primary); font-size:24px;"></i>
        </div>
    </div>

<script>
    const ADMIN_ID = "Winz_Dev";
    let myID = localStorage.getItem("xtr_session") || "";
    let activeChat = "";

    window.onload = () => { if(myID) openApp(); };

    function register() {
        let val = document.getElementById('idIn').value.trim().toLowerCase();
        if(!val) return;
        myID = val;
        localStorage.setItem("xtr_session", myID);
        let contacts = JSON.parse(localStorage.getItem(`contacts_${myID}`)) || [];
        if(!contacts.includes(ADMIN_ID)) contacts.unshift(ADMIN_ID);
        localStorage.setItem(`contacts_${myID}`, JSON.stringify(contacts));
        openApp();
    }

    function openApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        showSection('chats');
    }

    function showSection(sec) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(sec !== 'logout') document.getElementById('nav-'+sec).classList.add('active');
        document.getElementById('searchView').classList.toggle('hidden', sec !== 'contacts');
        renderList(sec);
    }

    function findUser() {
        let target = document.getElementById('searchIn').value.trim().toLowerCase();
        let contacts = JSON.parse(localStorage.getItem(`contacts_${myID}`)) || [];
        if(target && !contacts.includes(target)) {
            contacts.push(target);
            localStorage.setItem(`contacts_${myID}`, JSON.stringify(contacts));
            renderList('contacts');
        }
        document.getElementById('searchIn').value = "";
    }

    function renderList(type) {
        const area = document.getElementById('listView');
        const contacts = JSON.parse(localStorage.getItem(`contacts_${myID}`)) || [];
        let html = "";
        contacts.forEach(id => {
            const logs = JSON.parse(localStorage.getItem(`chat_${myID}_${id}`)) || [];
            if(type === 'chats' && logs.length === 0 && id !== ADMIN_ID) return;
            const last = logs.length ? (logs[logs.length-1].type === 'file' ? '📁 File/Gambar' : logs[logs.length-1].content) : "No message";
            html += `<div class="user-list-item" onclick="startChat('${id}')">
                <div class="user-avatar">${id[0].toUpperCase()}</div>
                <div style="flex:1"><strong>${id} ${id === ADMIN_ID.toLowerCase() ? '<span class="badge">OWNER</span>' : ''}</strong><p style="font-size:11px;color:var(--dim);">${last}</p></div>
            </div>`;
        });
        area.innerHTML = html || '<p style="text-align:center;padding:20px;opacity:0.5;">Kosong</p>';
    }

    function startChat(id) {
        activeChat = id;
        document.getElementById('chatView').style.display = 'flex';
        document.getElementById('chatTargetName').innerText = id;
        loadMessages();
    }

    function closeChat() { document.getElementById('chatView').style.display = 'none'; renderList('chats'); }

    function sendText() {
        const val = document.getElementById('msgIn').value.trim();
        if(!val) return;
        saveMsg({ type: 'text', content: val });
        document.getElementById('msgIn').value = "";
    }

    function sendFile() {
        const file = document.getElementById('fileIn').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            saveMsg({ type: 'file', content: e.target.result, fileName: file.name, isImg: file.type.startsWith('image/') });
        };
        reader.readAsDataURL(file);
    }

    function saveMsg(obj) {
        const key = `chat_${myID}_${activeChat}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        obj.sender = myID;
        obj.time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        logs.push(obj);
        localStorage.setItem(key, JSON.stringify(logs));
        loadMessages();
    }

    function loadMessages() {
        const area = document.getElementById('msgArea');
        const logs = JSON.parse(localStorage.getItem(`chat_${myID}_${activeChat}`)) || [];
        area.innerHTML = logs.map(m => `
            <div class="msg ${m.sender === myID ? 'me' : 'others'}">
                ${m.type === 'file' ? (m.isImg ? `<img src="${m.content}">` : `📁 ${m.fileName}`) : m.content}
                <div style="font-size:8px; opacity:0.5; text-align:right;">${m.time}</div>
            </div>`).join("");
        area.scrollTop = area.scrollHeight;
    }

    function logout() { localStorage.removeItem("xtr_session"); location.reload(); }
</script>
</body>
</html>
