<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR DASHBOARD</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --card: #0d0d1a;
            --primary: #38bdf8;
            --accent: #10b981;
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: var(--font-display); min-height: 100vh; padding-bottom: 50px; }

        /* Header / Navbar */
        .navbar {
            padding: 20px; background: var(--card); border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: var(--primary); }

        /* Welcome Card */
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .user-card {
            background: linear-gradient(135deg, #151c2c 0%, #0d0d1a 100%);
            padding: 25px; border-radius: 24px; border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .user-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
        }

        .balance-label { font-family: var(--font-mono); font-size: 10px; color: var(--primary); text-transform: uppercase; }
        .balance-val { font-size: 32px; font-weight: 700; margin: 5px 0; }
        .user-id { font-family: var(--font-mono); font-size: 12px; opacity: 0.6; }

        /* Grid Menu */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1–fr); gap: 15px; margin-bottom: 30px; }
        .menu-item {
            background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center; text-decoration: none; color: white; transition: 0.3s;
        }
        .menu-item:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.1); }
        .menu-item i { font-size: 24px; color: var(--primary); margin-bottom: 10px; display: block; }
        .menu-item span { font-size: 14px; font-weight: 600; }

        /* Activity Section */
        .section-title { font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--accent); }
        
        .activity-list { display: flex; flex-direction: column; gap: 10px; }
        .activity-item {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .activity-info h4 { font-size: 14px; margin-bottom: 4px; }
        .activity-info p { font-size: 11px; color: var(--dim); font-family: var(--font-mono); }
        .status-badge { font-size: 9px; padding: 4px 8px; border-radius: 5px; background: rgba(56, 189, 248, 0.2); color: var(--primary); }

        .btn-logout {
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #ef4444;
            background: transparent; color: #ef4444; font-family: var(--font-display);
            font-weight: 700; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">XTR <span style="color:white">TERMINAL</span></div>
        <i class="fas fa-bell" style="opacity:0.5"></i>
    </div>

    <div class="container">
        <div class="user-card">
            <p class="balance-label">Main Balance</p>
            <div class="balance-val">Rp 500.000</div>
            <p class="user-id">ID: <span id="userIdDisplay">LOADING...</span></p>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <div class="status-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--accent);">
                    <i class="fas fa-check-circle"></i> VERIFIED
                </div>
            </div>
        </div>

        <div class="menu-grid">
            <a href="vps.html" class="menu-item">
                <i class="fas fa-server"></i>
                <span>Order VPS</span>
            </a>
            <a href="smm.html" class="menu-item">
                <i class="fas fa-rocket"></i>
                <span>SMM Store</span>
            </a>
            <a href="chat.html" class="menu-item">
                <i class="fas fa-shield-halved"></i>
                <span>Secure Chat</span>
            </a>
            <a href="support.html" class="menu-item">
                <i class="fas fa-headset"></i>
                <span>Support</span>
            </a>
        </div>

        <div class="section-title">
            <i class="fas fa-bolt"></i> AKTIVITAS TERAKHIR
        </div>
        <div id="activityContainer" class="activity-list">
            </div>

        <button class="btn-logout" onclick="logout()">
            <i class="fas fa-power-off"></i> KELUAR SESSION
        </button>
    </div>

    <script>
        const SESSION_KEY = "xtr_session_id";
        const DATABASE_KEY = "vpsOrders";

        window.onload = function() {
            const user = localStorage.getItem(SESSION_KEY) || localStorage.getItem("currentUser");
            
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById('userIdDisplay').innerText = user.toUpperCase();
            loadActivities(user);
        };

        function loadActivities(user) {
            const container = document.getElementById('activityContainer');
            const data = JSON.parse(localStorage.getItem(DATABASE_KEY)) || [];
            
            // Filter hanya milik user ini
            const userActivity = data.filter(item => item.nomor === user).slice(0, 5);

            if (userActivity.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.3; font-size:12px; padding:20px;">Belum ada aktivitas.</p>';
                return;
            }

            container.innerHTML = userActivity.map(item => `
                <div class="activity-item">
                    <div class="activity-info">
                        <h4>${item.paket}</h4>
                        <p>${item.waktu}</p>
                    </div>
                    <div class="status-badge">${item.status}</div>
                </div>
            `).join('');
        }

        function logout() {
            if(confirm("Yakin ingin mengakhiri sesi terminal?")) {
                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem("currentUser");
                location.reload();
            }
        }
    </script>
</body>
</html>
