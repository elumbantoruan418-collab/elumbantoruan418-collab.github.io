<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR DASHBOARD</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #030305;
            --card: #0d0d1a;
            --primary: #38bdf8;
            --accent: #10b981;
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow-glow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: var(--font-display); 
            min-height: 100vh; 
            padding-bottom: 80px; 
            overflow-x: hidden;
        }

        /* Navbar Modern */
        .navbar {
            padding: 15px 20px; 
            background: rgba(13, 13, 26, 0.8); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--primary); text-shadow: var(--shadow-glow); }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* User Card Glow */
        .user-card {
            background: linear-gradient(135deg, #151c2c 0%, #0d0d1a 100%);
            padding: 25px; border-radius: 24px; 
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 25px; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .user-card::after {
            content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
        }

        .balance-label { font-family: var(--font-mono); font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .balance-val { font-size: 34px; font-weight: 700; margin: 5px 0; color: #fff; }
        .user-id { font-family: var(--font-mono); font-size: 12px; opacity: 0.7; color: var(--primary); }

        /* Menu Grid Refined */
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .menu-item {
            background: var(--card); padding: 22px 15px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center; text-decoration: none; color: white; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .menu-item:active { transform: scale(0.92); background: rgba(56, 189, 248, 0.1); border-color: var(--primary); }
        .menu-item i { font-size: 26px; color: var(--primary); text-shadow: var(--shadow-glow); }
        .menu-item span { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Activity Section */
        .section-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; padding: 0 5px;
        }
        .section-title { font-size: 14px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); }
        
        .activity-list { display: flex; flex-direction: column; gap: 12px; }
        .activity-item {
            background: rgba(255,255,255,0.03); padding: 16px; border-radius: 18px;
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .activity-item:hover { background: rgba(255,255,255,0.06); }
        
        .activity-info h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #e2e8f0; }
        .activity-info p { font-size: 10px; color: #64748b; font-family: var(--font-mono); }
        
        .status-badge { 
            font-size: 9px; padding: 5px 10px; border-radius: 8px; 
            background: rgba(56, 189, 248, 0.1); color: var(--primary); 
            font-weight: 800; border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* Footer Info / Support */
        .footer-credit {
            text-align: center; margin-top: 30px; padding: 20px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }
        .social-link {
            color: var(--primary); text-decoration: none; font-family: var(--font-mono);
            font-size: 13px; font-weight: bold; transition: 0.3s;
        }
        .social-link:hover { text-shadow: var(--shadow-glow); }

        .btn-logout {
            width: 100%; padding: 16px; border-radius: 15px; 
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05); color: #ef4444; 
            font-family: var(--font-display); font-size: 14px;
            font-weight: 800; cursor: pointer; margin-top: 20px;
            text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">XTR <span style="color:white">DASHBOARD</span></div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <i class="fas fa-signal" style="color: var(--accent); font-size: 12px;"></i>
            <i class="fas fa-user-circle" style="font-size: 20px; opacity: 0.8;"></i>
        </div>
    </nav>

    <div class="container">
        <div class="user-card">
            <p class="balance-label"><i class="fas fa-wallet"></i> Digital Balance</p>
            <div class="balance-val">Rp 500.000</div>
            <p class="user-id">ACCESS KEY: <span id="userIdDisplay">...</span></p>
        </div>

        <div class="menu-grid">
            <a href="vps.html" class="menu-item">
                <i class="fas fa-microchip"></i>
                <span>Cloud VPS</span>
            </a>
            <a href="smm.html" class="menu-item">
                <i class="fas fa-chart-line"></i>
                <span>SMM Store</span>
            </a>
            <a href="chat.html" class="menu-item">
                <i class="fas fa-user-secret"></i>
                <span>Secure Chat</span>
            </a>
            <a href="support.html" class="menu-item">
                <i class="fas fa-headset"></i>
                <span>Help Desk</span>
            </a>
        </div>

        <div class="section-header">
            <div class="section-title">
                <i class="fas fa-history"></i> SYSTEM LOGS
            </div>
            <span style="font-size: 10px; color: #475569; font-family: var(--font-mono);">LAST 5 ACTIONS</span>
        </div>
        
        <div id="activityContainer" class="activity-list">
            </div>

        <div class="footer-credit">
            <p style="font-size: 11px; opacity: 0.5; margin-bottom: 8px;">Official Support Channel</p>
            <a href="https://t.me/Winz_ofcial" target="_blank" class="social-link">
                <i class="fab fa-telegram"></i> @Winz_ofcial
            </a>
        </div>

        <button class="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> TERMINATE SESSION
        </button>
    </div>

    <script>
        const SESSION_KEY = "xtr_session_id";
        const DATABASE_KEY = "vpsOrders";

        window.onload = function() {
            // Logic: Cek session. Jika tidak ada, tendang ke login.html (bukan index.html agar tidak looping)
            const user = localStorage.getItem(SESSION_KEY) || localStorage.getItem("currentUser");
            
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            // Update UI
            document.getElementById('userIdDisplay').innerText = user.toUpperCase();
            loadActivities(user);
        };

        function loadActivities(user) {
            const container = document.getElementById('activityContainer');
            const data = JSON.parse(localStorage.getItem(DATABASE_KEY)) || [];
            
            // Filter log aktivitas milik user saat ini
            const userActivity = data.filter(item => item.nomor === user).slice(0, 5);

            if (userActivity.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px; border: 1px dashed rgba(255,255,255,0.05); border-radius: 20px;">
                        <i class="fas fa-folder-open" style="font-size: 24px; opacity:0.2; margin-bottom:10px; display:block;"></i>
                        <p style="opacity:0.3; font-size:12px;">No recent activities found.</p>
                    </div>`;
                return;
            }

            container.innerHTML = userActivity.map(item => `
                <div class="activity-item">
                    <div class="activity-info">
                        <h4>${item.paket}</h4>
                        <p><i class="far fa-clock"></i> ${item.waktu}</p>
                    </div>
                    <div class="status-badge">${item.status.toUpperCase()}</div>
                </div>
            `).join('');
        }

        function logout() {
            if(confirm("Apakah Anda yakin ingin memutus sesi ini?")) {
                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem("currentUser");
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
