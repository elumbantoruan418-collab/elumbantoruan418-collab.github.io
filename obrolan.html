<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR TERMINAL PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0f19; --card: #151c2c; --primary: #38bdf8; --text: #ffffff; 
            --dim: #94a3b8; --accent: #10b981; 
            --msg-me-bg: #ffffff; --msg-me-text: #0b0f19;
            --msg-others-bg: #061a14; --msg-others-text: #34d399;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* FIX: Body jangan pakai fixed biar scroll internal lancar */
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; width: 100%; overflow: hidden; }
        
        input { user-select: text !important; outline: none; }

        .screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(56, 189, 248, 0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #2d3748; background: #0b0f19; color: white; margin-bottom: 15px; }
        .btn { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 10px; font-family: 'Rajdhani'; letter-spacing: 1px; }

        /* FIX: Layout App Utama */
        #app { display: none; flex-direction: column; height: 100vh; width: 100%; position: relative; }
        
        .header-ui { padding: 15px; background: var(--card); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .search-box { display: flex; background: #0b0f19; border-radius: 12px; border: 1px solid #2d3748; align-items: center; padding: 0 10px; }
        .search-box input { border: none; margin-bottom: 0; padding: 12px; flex: 1; background: transparent; }

        #listView { flex: 1; overflow-y: auto; padding-bottom: 80px; } /* Kasih space buat nav */
        
        .user-list-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
        .user-avatar { width: 45px; height: 45px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 18px; }

        /* FIX: Chat View Overlay */
        #chatView { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .chat-header { background: var(--card); padding: 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        #msgArea { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
        .msg.me { align-self: flex-end; background: var(--msg-me-bg); color: var(--msg-me-text); border-bottom-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: var(--msg-others-bg); color: var(--msg-others-text); border: 1px solid #065f46; border-bottom-left-radius: 2px; }

        .input-bar { padding: 15px; background: var(--card); display: flex; gap: 12px; align-items: center; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        
        /* FIX: Navigation Bottom murni di bawah */
        .nav-bottom { 
            position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--card); display: flex; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            padding: 10px 0; 
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            z-index: 100;
        }
        .nav-item { flex: 1; text-align: center; color: var(--dim); font-size: 11px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .hidden { display: none !important; }
        .badge { font-size: 9px; background: var(--accent); color: #000; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginScreen" class="screen">
        <div class="box">
            <i class="fas fa-terminal" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 style="font-family:'Rajdhani';">WINZ XTR GATE</h2>
            <input type="text" id="idIn" placeholder="Enter Unique ID...">
            <button class="btn" onclick="register()">INITIALIZE ACCESS</button>
        </div>
    </div>

    <div id="app">
        <div id="searchView" class="header-ui hidden">
            <div class="search-box">
                <input type="text" id="searchIn" placeholder="ID Teman...">
                <button onclick="findUser()" style="background:none; border:none; color:var(--primary); padding:10px;"><i class="fas fa-user-plus"></i></button>
            </div>
        </div>

        <div id="listView"></div>

        <div class="nav-bottom">
            <div id="nav-chats" class="nav-item active" onclick="showSection('chats')">
                <i class="fas fa-comment-alt"></i><br>Chats
            </div>
            <div id="nav-contacts" class="nav-item" onclick="showSection('contacts')">
                <i class="fas fa-address-book"></i><br>Kontak
            </div>
            <div id="nav-logout" class="nav-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i><br>Logout
            </div>
        </div>
    </div>

    <div id="chatView">
        <div class="chat-header">
            <i class="fas fa-chevron-left" onclick="closeChat()" style="padding:10px; font-size: 20px;"></i>
            <div id="chatTargetName" style="flex:1; font-family:'Rajdhani'; font-size:18px;">Target</div>
            <div id="targetBadge"></div>
        </div>
        <div id="msgArea"></div>
        <div class="input-bar">
            <input type="text" id="msgIn" placeholder="Type message...">
            <button onclick="sendText()" style="background:none; border:none; color:var(--primary); font-size:20px;">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

<script>
    const ADMIN_ID = "Winz_Dev"; 
    let myID = localStorage.getItem("xtr_session_id") || "";
    let activeChat = "";

    // Auto-login logic
    if(myID) {
        window.addEventListener('DOMContentLoaded', () => {
            openApp();
        });
    }

    function register() {
        const val = document.getElementById('idIn').value.trim().toLowerCase();
        if(!val) return alert("ID Kosong!");
        myID = val;
        localStorage.setItem("xtr_session_id", myID);
        
        let contacts = JSON.parse(localStorage.getItem(`contacts_${myID}`)) || [];
        if(!contacts.includes(ADMIN_ID) && myID !== ADMIN_ID.toLowerCase()) {
            contacts.unshift(ADMIN_ID);
            localStorage.setItem(`contacts_${myID}`, JSON.stringify(contacts));
        }
        openApp();
    }

    function openApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        showSection('chats');
    }

    function showSection(sec) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('nav-'+sec).classList.add('active');
        
        const sView = document.getElementById('searchView');
        if(sec === 'contacts') sView.classList.remove('hidden');
        else sView.classList.add('hidden');
        
        renderList(sec);
    }

    function findUser() {
        const target = document.getElementById('searchIn').value.trim().toLowerCase();
        if(!target || target === myID) return alert("ID Tidak Valid!");

        let myContacts = JSON.parse(localStorage.getItem(`contacts_${myID}`)) || [];
        if(!myContacts.includes(target)) {
            myContacts.push(target);
            localStorage.setItem(`contacts_${myID}`, JSON.stringify(myContacts));
            alert("Kontak ditambahkan!");
        }
        document.getElementById('searchIn').value = "";
        renderList('contacts');
    }

    function renderList(type) {
        const listArea = document.getElementById('listView');
        const myContacts = JSON.parse(localStorage.getItem(`contacts_${myID}`)) || [];
        
        let html = "";
        myContacts.forEach(id => {
            const chatKey = `chat_${myID}_with_${id}`;
            const logs = JSON.parse(localStorage.getItem(chatKey)) || [];
            
            if(type === 'chats' && logs.length === 0 && id !== ADMIN_ID) return;

            const lastMsg = logs.length > 0 ? logs[logs.length-1].content : "No messages yet";
            const isOwner = id.toLowerCase() === ADMIN_ID.toLowerCase();

            html += `
                <div class="user-list-item" onclick="startChat('${id}')">
                    <div class="user-avatar" style="${isOwner ? 'background:var(--accent)' : ''}">${id[0].toUpperCase()}</div>
                    <div style="flex:1">
                        <strong>${id} ${isOwner ? '<span class="badge">OWNER</span>' : ''}</strong>
                        <p style="font-size:11px; color:var(--dim);">${lastMsg}</p>
                    </div>
                </div>`;
        });
        
        listArea.innerHTML = html || `<p style="text-align:center; padding:50px; opacity:0.3;">Belum ada data.</p>`;
    }

    function startChat(id) {
        activeChat = id;
        document.getElementById('chatView').style.display = 'flex';
        document.getElementById('chatTargetName').innerText = id;
        document.getElementById('targetBadge').innerHTML = (id.toLowerCase() === ADMIN_ID.toLowerCase()) ? '<span class="badge">OWNER</span>' : '';
        loadMessages();
    }

    function closeChat() { 
        document.getElementById('chatView').style.display = 'none'; 
        renderList('chats');
    }

    function sendText() {
        const el = document.getElementById('msgIn');
        if(!el.value.trim()) return;
        
        const chatKey = `chat_${myID}_with_${activeChat}`;
        let logs = JSON.parse(localStorage.getItem(chatKey)) || [];
        
        logs.push({ 
            sender: myID, 
            content: el.value.trim(), 
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) 
        });
        
        localStorage.setItem(chatKey, JSON.stringify(logs));
        el.value = "";
        loadMessages();
    }

    function loadMessages() {
        const area = document.getElementById('msgArea');
        const chatKey = `chat_${myID}_with_${activeChat}`;
        const logs = JSON.parse(localStorage.getItem(chatKey)) || [];
        
        area.innerHTML = logs.map(m => `
            <div class="msg ${m.sender === myID ? 'me' : 'others'}">
                ${m.content}
                <div style="font-size:9px; text-align:right; opacity:0.4; margin-top:4px;">${m.time}</div>
            </div>`).join("");
        area.scrollTop = area.scrollHeight;
    }

    function logout() {
        if(confirm("Logout dari terminal?")) {
            localStorage.removeItem("xtr_session_id");
            location.reload();
        }
    }
</script>
</body>
</html>
