<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR TERMINAL PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --card: #151c2c; --primary: #38bdf8; --text: #ffffff; --dim: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }

        /* Screens */
        .screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .box { background: var(--card); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(56, 189, 248, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #2d3748; background: #0b0f19; color: white; margin-bottom: 15px; outline: none; }
        .btn { background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }

        /* Main App */
        #app { display: none; flex-direction: column; height: 100vh; position: relative; z-index: 10; }
        .header { background: var(--card); padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Nav Bottom */
        .nav-bottom { background: var(--card); display: flex; border-top: 1px solid rgba(255,255,255,0.05); padding: 12px 0; }
        .nav-item { flex: 1; text-align: center; color: var(--dim); font-size: 11px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        /* Chat UI */
        #chatView { flex: 1; display: none; flex-direction: column; background: #0b0f19; }
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: radial-gradient(#1e293b 0.5px, transparent 0.5px); background-size: 20px 20px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: #0284c7; border-bottom-right-radius: 2px; }
        .msg.others { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 10px; margin: 5px 0; display: block; }

        .input-bar { padding: 12px; background: var(--card); display: flex; gap: 10px; align-items: center; }
        .icon-btn { color: var(--primary); font-size: 22px; cursor: pointer; }

        /* Lists */
        .user-list-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .user-avatar { width: 45px; height: 45px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; overflow: hidden; border: 2px solid rgba(56, 189, 248, 0.2); }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginScreen" class="screen">
        <div class="box">
            <i class="fas fa-fingerprint" style="font-size: 50px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 style="font-family:'Rajdhani'; letter-spacing: 1px;">WINZ XTR SYSTEM</h2>
            <p style="color:var(--dim); font-size:12px; margin-bottom:20px;">Masukkan ID untuk Aktivasi Akun</p>
            <input type="text" id="idIn" placeholder="Contoh: Winz_Dev">
            <button class="btn" onclick="register()">BUKA AKSES</button>
        </div>
    </div>

    <div id="dashScreen" class="screen hidden" style="background: radial-gradient(circle at top, #1e293b, #0b0f19);">
        <div class="box">
            <label for="profFile" style="cursor:pointer; position:relative; display:inline-block;">
                <div id="profAva" class="user-avatar" style="width:90px; height:90px; font-size: 35px; margin-bottom: 15px;">W</div>
                <i class="fas fa-camera" style="position:absolute; bottom:20px; right:0; background:var(--primary); color:#000; padding:5px; border-radius:50%; font-size:12px;"></i>
            </label>
            <input type="file" id="profFile" class="hidden" accept="image/*" onchange="updateProfilePic()">
            
            <input type="text" id="editNameIn" placeholder="Ubah Nama..." style="text-align:center; margin-top:10px;">
            <p style="color:#10b981; font-size:11px; margin-bottom:20px;"><i class="fas fa-check-circle"></i> Status: Connected</p>
            
            <button class="btn" onclick="saveProfile()">SIMPAN & MASUK</button>
            <button class="btn" style="background:#1e293b; color:white;" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <div id="app">
        <div id="searchView" style="padding: 15px; background: var(--card);">
            <div style="display:flex; gap:10px;">
                <input type="text" id="searchIn" placeholder="Cari ID Teman..." style="margin-bottom:0;">
                <button class="btn" style="width:60px; margin-top:0;" onclick="findUser()"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <div id="listView" style="flex:1; overflow-y:auto;"></div>

        <div id="chatView">
            <div class="header">
                <i class="fas fa-arrow-left" onclick="backToList()" style="cursor:pointer; font-size:18px;"></i>
                <div class="user-avatar" id="chatAva" style="width:35px; height:35px;">?</div>
                <h4 id="chatTargetName" style="flex:1; margin-left:5px;">User</h4>
            </div>
            <div id="msgArea"></div>
            <div class="input-bar">
                <label class="icon-btn"><i class="fas fa-paperclip"></i><input type="file" id="fileIn" class="hidden" accept="image/*" onchange="sendFile()"></label>
                <input type="text" id="msgIn" placeholder="Ketik pesan..." style="margin-bottom:0;">
                <button class="btn" style="width:50px; margin-top:0;" onclick="sendText()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="nav-bottom">
            <div id="nav-chats" class="nav-item active" onclick="showSection('chats')"><i class="fas fa-comment-dots"></i><br>Obrolan</div>
            <div id="nav-contacts" class="nav-item" onclick="showSection('contacts')"><i class="fas fa-address-book"></i><br>Kontak</div>
            <div id="nav-profile" class="nav-item" onclick="showSection('profile')"><i class="fas fa-user-circle"></i><br>Profil</div>
        </div>
    </div>

<script>
    const ADMIN_ID = "Winz_Dev"; // Ganti ID lu di sini
    let myID = "";
    let myPic = "";
    let activeChat = "";

    window.onload = () => {
        myID = localStorage.getItem("xtr_user_id");
        myPic = localStorage.getItem("xtr_user_pic") || "";
        if(myID) {
            // Auto contact Admin
            let contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
            if(!contacts.includes(ADMIN_ID) && myID !== ADMIN_ID) {
                contacts.unshift(ADMIN_ID);
                localStorage.setItem("xtr_contacts", JSON.stringify(contacts));
            }
            showDash();
        }
    };

    function register() {
        const val = document.getElementById('idIn').value.trim();
        if(!val) return alert("Isi ID!");
        localStorage.setItem("xtr_user_id", val);
        myID = val;
        showDash();
    }

    function showDash() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashScreen').classList.remove('hidden');
        document.getElementById('app').style.display = 'none';
        document.getElementById('editNameIn').value = myID;
        updateAvaDisplay('profAva', myID, myPic);
    }

    function updateProfilePic() {
        const file = document.getElementById('profFile').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            myPic = e.target.result;
            updateAvaDisplay('profAva', myID, myPic);
        };
        reader.readAsDataURL(file);
    }

    function saveProfile() {
        const newName = document.getElementById('editNameIn').value.trim();
        if(!newName) return;
        myID = newName;
        localStorage.setItem("xtr_user_id", myID);
        localStorage.setItem("xtr_user_pic", myPic);
        openApp();
    }

    function openApp() {
        document.getElementById('dashScreen').classList.add('hidden');
        document.getElementById('app').style.display = 'flex';
        showSection('chats');
    }

    function showSection(sec) {
        if(sec === 'profile') return showDash();
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('nav-'+sec).classList.add('active');
        document.getElementById('chatView').style.display = 'none';
        document.getElementById('listView').style.display = 'block';
        document.getElementById('searchView').style.display = (sec === 'contacts') ? 'block' : 'none';
        renderList();
    }

    function findUser() {
        const target = document.getElementById('searchIn').value.trim();
        if(!target || target === myID) return alert("ID tidak valid!");
        startChat(target);
    }

    function startChat(id) {
        activeChat = id;
        document.getElementById('listView').style.display = 'none';
        document.getElementById('searchView').style.display = 'none';
        document.getElementById('chatView').style.display = 'flex';
        document.getElementById('chatTargetName').innerText = id;
        updateAvaDisplay('chatAva', id, ""); 
        loadMessages();
    }

    function sendText() {
        const txt = document.getElementById('msgIn').value.trim();
        if(!txt) return;
        saveMsg({ type: 'text', content: txt });
        document.getElementById('msgIn').value = "";
    }

    function sendFile() {
        const file = document.getElementById('fileIn').files[0];
        const reader = new FileReader();
        reader.onload = (e) => saveMsg({ type: 'img', content: e.target.result });
        reader.readAsDataURL(file);
    }

    function saveMsg(data) {
        const key = `chat_with_${activeChat}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        logs.push({ sender: myID, ...data, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        localStorage.setItem(key, JSON.stringify(logs));
        
        let contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        if(!contacts.includes(activeChat)) contacts.push(activeChat);
        localStorage.setItem("xtr_contacts", JSON.stringify(contacts));
        loadMessages();
    }

    function loadMessages() {
        const area = document.getElementById('msgArea');
        const logs = JSON.parse(localStorage.getItem(`chat_with_${activeChat}`)) || [];
        area.innerHTML = logs.map(m => `
            <div class="msg ${m.sender === myID ? 'me' : 'others'}">
                ${m.type === 'img' ? `<img src="${m.content}">` : m.content}
                <small style="display:block; font-size:9px; opacity:0.5; margin-top:4px; text-align:right;">${m.time}</small>
            </div>
        `).join("");
        area.scrollTop = area.scrollHeight;
    }

    function renderList() {
        const list = document.getElementById('listView');
        const data = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        list.innerHTML = data.map(u => `
            <div class="user-list-item" onclick="startChat('${u}')">
                <div class="user-avatar">${u[0].toUpperCase()}</div>
                <div style="flex:1">
                    <strong>${u} ${u === ADMIN_ID ? '<i class="fas fa-bolt" style="color:#facc15"></i>' : ''}</strong><br>
                    <small style="color:var(--dim)">${u === ADMIN_ID ? 'Official Admin' : 'Klik untuk chat'}</small>
                </div>
            </div>
        `).join("") || `<p style="padding:40px; text-align:center; opacity:0.3;">Belum ada kontak.</p>`;
    }

    function updateAvaDisplay(elementId, name, picData) {
        const el = document.getElementById(elementId);
        if(picData) el.innerHTML = `<img src="${picData}">`;
        else el.innerText = name[0].toUpperCase();
    }

    function backToList() { showSection('chats'); }
    function logout() { if(confirm("Keluar?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
    </html>
