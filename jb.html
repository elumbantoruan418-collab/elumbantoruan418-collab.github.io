<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR JB // Upload Product</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030305; --card: #0d0d1a; --primary: #ee4d2d; --accent: #38bdf8; --warning: #fbbf24; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.1); }
        h2 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        .alert-box { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--warning); padding: 12px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; font-size: 11px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--accent); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 12px; background: #151c2c; border: 1px solid #1e293b; border-radius: 10px; color: white; outline: none; }
        .btn-upload { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-upload:disabled { background: #444; cursor: not-allowed; }
        #imagePreview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .preview-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-plus-circle"></i> TAMBAH PRODUK</h2>
    <div class="alert-box">
        <i class="fas fa-exclamation-triangle" style="color:var(--warning)"></i>
        <p>Gunakan maksimal 3-5 foto agar memori browser tidak penuh (Limit 5MB).</p>
    </div>

    <form id="jbForm">
        <div class="form-group">
            <label>Foto Produk (Bisa banyak)</label>
            <input type="file" id="poto" accept="image/*" multiple required onchange="processImages(this)">
            <div id="imagePreview"></div>
        </div>
        <div class="form-group">
            <label>Judul</label>
            <input type="text" id="judul" placeholder="Contoh: Drone XT808" required>
        </div>
        <div class="form-group">
            <label>Harga Bersih (Rp)</label>
            <input type="number" id="harga" placeholder="Masukkan harga..." required>
        </div>
        <div class="form-group">
            <label>Deskripsi</label>
            <textarea id="deskripsi" rows="3" placeholder="Detail spesifikasi..." required></textarea>
        </div>
        <div class="form-group">
            <label>WhatsApp Penjual</label>
            <input type="text" id="nomorPenjual" placeholder="628xxxx" required>
        </div>
        <button type="submit" class="btn-upload" id="btnSubmit">POSTING KE MARKET</button>
    </form>
</div>

<script>
    let base64Images = [];

    // FUNGSI KOMPRES AGAR LOCALSTORAGE TIDAK FULL
    async function processImages(input) {
        const preview = document.getElementById('imagePreview');
        const btn = document.getElementById('btnSubmit');
        preview.innerHTML = "";
        base64Images = [];
        btn.disabled = true;
        btn.innerText = "MENGOMPRES FOTO...";

        const files = Array.from(input.files);
        
        for (let file of files) {
            try {
                const bitmap = await createImageBitmap(file);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set ukuran maksimal lebih kecil (600px) untuk menghemat banyak memori
                let width = bitmap.width;
                let height = bitmap.height;
                const max_size = 600; 

                if (width > height) {
                    if (width > max_size) {
                        height *= max_size / width;
                        width = max_size;
                    }
                } else {
                    if (height > max_size) {
                        width *= max_size / height;
                        height = max_size;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(bitmap, 0, 0, width, height);
                
                // Kualitas diturunkan ke 0.5 (50%) agar file sangat kecil (sekitar 30-50KB per foto)
                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
                base64Images.push(compressedBase64);

                const img = document.createElement('img');
                img.src = compressedBase64;
                img.className = 'preview-img';
                preview.appendChild(img);
            } catch (e) {
                console.error("Gagal proses gambar:", e);
            }
        }
        
        btn.disabled = false;
        btn.innerText = "POSTING KE MARKET";
    }

    document.getElementById('jbForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const dataBarang = {
            id: Date.now(),
            sku: "XTR-" + Math.floor(1000 + Math.random() * 9000),
            fotos: base64Images,
            judul: document.getElementById('judul').value,
            harga: document.getElementById('harga').value,
            deskripsi: document.getElementById('deskripsi').value,
            nomerPenjual: document.getElementById('nomorPenjual').value,
            waktu: new Date().toLocaleString('id-ID')
        };

        let listBarang = JSON.parse(localStorage.getItem("dataJB")) || [];
        
        // Batasi market hanya menyimpan 20 produk terbaru agar web tidak "mati" karena memori penuh
        if (listBarang.length >= 20) {
            listBarang.shift(); // Hapus jualan paling lama
        }
        
        listBarang.push(dataBarang);
        
        try {
            localStorage.setItem("dataJB", JSON.stringify(listBarang));
            alert("Produk Berhasil Diupload!");
            window.location.href = "index.html";
        } catch (err) {
            // Jika masih gagal, paksa hapus 5 item lama
            alert("Memori browser penuh! Menghapus beberapa jualan lama otomatis...");
            listBarang.splice(0, 5); 
            localStorage.setItem("dataJB", JSON.stringify(listBarang));
            location.reload();
        }
    });
</script>
</body>
</html>
