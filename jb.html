<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR MARKET</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #030305; color: white; font-family: sans-serif; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #38bdf8; }
        #marketList { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-card { background: #0d0d1a; border-radius: 12px; overflow: hidden; border: 1px solid rgba(56,189,248,0.1); cursor: pointer; }
        .img-card img { width: 100%; height: 110px; object-fit: cover; }
        .info { padding: 8px; }
        .p-title { font-size: 12px; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { color: #ee4d2d; font-weight: bold; font-size: 14px; margin-top: 5px; }

        /* Modal Detail */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #030305; z-index: 9999; display: none; overflow-y: auto; }
        .modal-header { padding: 15px; display: flex; align-items: center; background: #0d0d1a; position: sticky; top:0; }
        .detail-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 300px; background: #000; scrollbar-width: none; }
        .detail-slider img { flex-shrink: 0; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
        .detail-info { padding: 20px; }
        .btn-wa { display: block; background: #ee4d2d; color: white; text-align: center; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; position: fixed; bottom: 20px; width: 90%; left: 5%; }
    </style>
</head>
<body>

    <div class="header">
        <h3><i class="fas fa-shopping-bag"></i> XTR MARKET</h3>
        <a href="upload.html" style="color: #38bdf8; text-decoration: none; font-size: 12px; border: 1px solid; padding: 5px 10px; border-radius: 5px;">+ JUAL</a>
    </div>

    <div id="marketList"></div>

    <div id="productModal" class="modal">
        <div class="modal-header">
            <i class="fas fa-arrow-left" onclick="closeDetail()"></i>
            <span style="margin-left: 15px;">Detail Produk</span>
        </div>
        <div id="detailSlider" class="detail-slider"></div>
        <div class="detail-info">
            <h2 id="detailPrice" style="color: #ee4d2d;"></h2>
            <h4 id="detailTitle" style="margin: 10px 0;"></h4>
            <p id="detailSKU" style="font-size: 11px; color: #38bdf8;"></p>
            <hr style="opacity: 0.1; margin: 15px 0;">
            <p id="detailDesc" style="color: #94a3b8; font-size: 14px; line-height: 1.5;"></p>
        </div>
        <div style="height: 100px;"></div>
        <a id="btnBeli" href="#" class="btn-wa" target="_blank">HUBUNGI ADMIN</a>
    </div>

    <script>
        const ADMIN_WA = "639319692180";
        let currentProducts = [];

        function renderMarket() {
            const container = document.getElementById('marketList');
            const data = JSON.parse(localStorage.getItem("dataJB")) || [];
            currentProducts = [...data].reverse();

            if(currentProducts.length === 0) {
                container.innerHTML = "<p style='grid-column: span 2; text-align:center; opacity:0.5;'>Belum ada produk.</p>";
                return;
            }

            container.innerHTML = currentProducts.map((item, index) => `
                <div class="product-card" onclick="openDetail(${index})">
                    <div class="img-card"><img src="${item.fotos[0]}"></div>
                    <div class="info">
                        <p class="p-title">${item.judul}</p>
                        <p class="p-price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</p>
                    </div>
                </div>
            `).join('');
        }

        function openDetail(index) {
            const item = currentProducts[index];
            document.getElementById('detailSlider').innerHTML = item.fotos.map(f => `<img src="${f}">`).join('');
            document.getElementById('detailPrice').innerText = "Rp " + parseInt(item.harga).toLocaleString('id-ID');
            document.getElementById('detailTitle').innerText = item.judul;
            document.getElementById('detailSKU').innerText = "KODE: " + item.sku;
            document.getElementById('detailDesc').innerText = item.deskripsi;
            
            const pesan = encodeURIComponent(`Halo Admin, mau beli produk:\n*${item.judul}*\n*Harga:* Rp ${item.harga}\n*Kode:* ${item.sku}`);
            document.getElementById('btnBeli').href = `https://wa.me/${ADMIN_WA}?text=${pesan}`;
            
            document.getElementById('productModal').style.display = 'block';
        }

        function closeDetail() { document.getElementById('productModal').style.display = 'none'; }

        window.onload = renderMarket;
    </script>
</body>
</html>
