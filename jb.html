<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR JB // Upload Product</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030305; --card: #0d0d1a; --primary: #38bdf8; --accent: #10b981; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
        h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--primary); margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; background: #151c2c; border: 1px solid #1e293b; border-radius: 10px; color: white; }
        .btn-upload { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; color: var(--bg); font-weight: 800; cursor: pointer; margin-top: 10px; }
        #imagePreview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .preview-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-shopping-cart"></i> POST BARANG BARU</h2>
    <form id="jbForm">
        <div class="form-group">
            <label>POTO PRODUK (Bisa banyak)</label>
            <input type="file" id="poto" accept="image/*" multiple required onchange="previewImages()">
            <div id="imagePreview"></div>
        </div>
        <div class="form-group">
            <label>HARGA (Rp)</label>
            <input type="number" id="harga" placeholder="Contoh: 50000" required>
        </div>
        <div class="form-group">
            <label>DESKRIPSI BARANG</label>
            <textarea id="deskripsi" rows="4" placeholder="Spek akun/jasa..." required></textarea>
        </div>
        <div class="form-group">
            <label>NOMOR HP PENJUAL (Sembunyi dari Pembeli)</label>
            <input type="text" id="nomorPenjual" placeholder="628xxxx" required>
        </div>
        <button type="submit" class="btn-upload">SIMPAN KE MARKET</button>
    </form>
</div>

<script>
    let base64Images = [];

    function previewImages() {
        const preview = document.getElementById('imagePreview');
        preview.innerHTML = "";
        base64Images = [];
        const files = document.getElementById('poto').files;

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Images.push(e.target.result);
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'preview-img';
                preview.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('jbForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const dataBarang = {
            id: Date.now(),
            fotos: base64Images,
            harga: document.getElementById('harga').value,
            deskripsi: document.getElementById('deskripsi').value,
            nomerPenjual: document.getElementById('nomorPenjual').value,
            waktu: new Date().toLocaleString('id-ID')
        };

        const listBarang = JSON.parse(localStorage.getItem("dataJB")) || [];
        listBarang.push(dataBarang);
        localStorage.setItem("dataJB", JSON.stringify(listBarang));

        alert("Berhasil disimpan ke simpan.html!");
        window.location.href = "simpan.html";
    });
</script>
</body>
</html>
