<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR // Simpan Produk</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030305; --card: #0d0d1a; --primary: #38bdf8; --accent: #10b981; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 15px; }
        .product-card { background: var(--card); border-radius: 20px; overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.1); }
        .img-slider { display: flex; overflow-x: auto; gap: 8px; padding: 12px; scroll-snap-type: x mandatory; }
        .img-slider img { height: 180px; border-radius: 12px; scroll-snap-align: start; flex-shrink: 0; }
        .info { padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .sku-tag { font-size: 10px; color: var(--accent); font-family: monospace; background: rgba(16, 185, 129, 0.1); padding: 2px 6px; border-radius: 4px; }
        .price { font-size: 22px; font-weight: 800; color: var(--primary); margin: 8px 0; }
        .desc { font-size: 13px; opacity: 0.8; line-height: 1.5; margin-bottom: 15px; }
        .btn-buy { 
            width: 100%; padding: 14px; background: var(--primary); color: #000; 
            border: none; border-radius: 12px; font-weight: 800; cursor: pointer; 
            text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 10px; 
        }
    </style>
</head>
<body>

    <h2 style="text-align:center; margin-bottom:20px; color:var(--primary);">XTR MARKETPLACE</h2>
    <div id="marketList"></div>

    <script>
        const ADMIN_NUMBER = "639319692180";

        function loadMarket() {
            const list = JSON.parse(localStorage.getItem("dataJB")) || [];
            const container = document.getElementById('marketList');

            if(list.length === 0) {
                container.innerHTML = "<div style='text-align:center; margin-top:50px; opacity:0.3;'><i class='fas fa-box-open fa-3x'></i><p>Belum ada barang diupload.</p></div>";
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="product-card">
                    <div class="img-slider">
                        ${item.fotos.map(img => `<img src="${img}" alt="Product">`).join('')}
                    </div>
                    <div class="info">
                        <span class="sku-tag">CODE: ${item.sku}</span>
                        <div class="price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</div>
                        <p class="desc">${item.deskripsi}</p>
                        <a href="https://wa.me/${ADMIN_NUMBER}?text=Halo Admin, saya ingin beli barang dengan Kode: ${item.sku}" class="btn-buy">
                            <i class="fab fa-whatsapp"></i> HUBUNGI ADMIN MC
                        </a>
                    </div>
                </div>
            `).reverse().join('');
        }
        loadMarket();
    </script>
</body>
</html>
