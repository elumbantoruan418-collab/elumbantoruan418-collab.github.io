<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz // XTR COMMAND CENTER</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b1118; --card: #151d27; --primary: #38bdf8; 
            --text: #ffffff; --dim: #94a3b8; --accent: #22c55e; 
        }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; margin: 0; padding: 0;
        }

        /* --- SIDEBAR STANDAR --- */
        .sidebar { 
            background: var(--card); border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 15px;
        }

        .section-label { 
            color: var(--primary); font-family: 'Rajdhani'; 
            font-weight: bold; font-size: 14px; margin: 15px 0 10px;
            display: flex; justify-content: space-between;
        }

        .item-card { 
            background: #1e293b; padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; border-left: 4px solid #475569;
        }
        .item-card.active { border-left-color: var(--primary); background: #2b5278; }

        /* --- AREA CHAT STANDAR --- */
        .main-chat { padding: 15px; padding-bottom: 120px; } /* Jarak bawah biar gak kena input */
        
        .chat-header { 
            background: var(--card); padding: 15px; border-radius: 12px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
        }

        .msg { 
            max-width: 85%; padding: 12px; border-radius: 12px; 
            margin-bottom: 10px; font-size: 14px; line-height: 1.4;
        }
        .msg.admin { align-self: flex-end; background: #0284c7; margin-left: auto; }
        .msg.user { align-self: flex-start; background: #1e293b; }

        /* --- TOMBOL KIRIM DINAIKKAN (ABSOLUTE BOTTOM) --- */
        .input-container {
            position: fixed;
            bottom: 20px; /* GW NAIKKAN JARAKNYA DARI BAWAH */
            left: 10px;
            right: 10px;
            background: var(--card);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 999;
        }

        textarea { 
            flex: 1; background: #0b1118; border: 1px solid #2d3748; 
            border-radius: 8px; color: white; padding: 10px; height: 45px;
            outline: none; resize: none;
        }

        .btn-send { 
            background: var(--primary); border: none; width: 55px; 
            border-radius: 8px; color: #000; font-size: 18px; font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="section-label"><span><i class="fas fa-comments"></i> CHAT</span></div>
        <div id="chatUsersList"></div>
        
        <div class="section-label">
            <span><i class="fas fa-shopping-cart"></i> ORDERS</span>
            <span id="orderCount" style="background:red; padding:0 6px; border-radius:10px; font-size:10px;">0</span>
        </div>
        <div id="orderQueueList"></div>
    </div>

    <div class="main-chat" id="mainChatArea">
        <div id="chatHeader" class="chat-header hidden">
            <div style="background:var(--primary); color:#000; width:35px; height:35px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:bold;" id="headAva">?</div>
            <h4 id="headName" style="font-family:'Rajdhani'">PILIH USER</h4>
        </div>

        <div id="msgArea"></div>
    </div>

    <div id="inputBar" class="input-container hidden">
        <textarea id="replyMsg" placeholder="Balas pesan..."></textarea>
        <button class="btn-send" onclick="sendAdminMsg()"><i class="fas fa-paper-plane"></i></button>
    </div>

<script>
    let activeUser = "";

    function renderLists() {
        const chatList = document.getElementById('chatUsersList');
        const orderList = document.getElementById('orderQueueList');
        const contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        const orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];

        document.getElementById('orderCount').innerText = orders.length;

        chatList.innerHTML = contacts.map(id => `
            <div class="item-card ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}')">
                <h5 style="margin:0; font-size:13px;">${id}</h5>
            </div>`).join("");

        orderList.innerHTML = orders.map(id => `
            <div class="item-card active" onclick="selectUser('${id}')">
                <h5 style="margin:0; font-size:13px; color:var(--accent)">${id} (ORDER)</h5>
            </div>`).join("");
    }

    function selectUser(id) {
        activeUser = id;
        document.getElementById('chatHeader').classList.remove('hidden');
        document.getElementById('inputBar').classList.remove('hidden');
        document.getElementById('headName').innerText = id;
        document.getElementById('headAva').innerText = id[0].toUpperCase();
        renderChat();
        renderLists();
    }

    function renderChat() {
        if(!activeUser) return;
        const area = document.getElementById('msgArea');
        const logs = JSON.parse(localStorage.getItem(`chat_with_${activeUser}`)) || [];
        area.innerHTML = logs.map(m => `
            <div class="msg ${m.sender === 'ADMIN_WINZ' ? 'admin' : 'user'}">
                ${m.content}
                <div style="font-size:8px; opacity:0.5; margin-top:4px; text-align:right;">${m.time}</div>
            </div>`).join("");
        window.scrollTo(0, document.body.scrollHeight);
    }

    function sendAdminMsg() {
        const txt = document.getElementById('replyMsg').value.trim();
        if(!txt || !activeUser) return;
        
        const key = `chat_with_${activeUser}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        logs.push({ 
            sender: "ADMIN_WINZ", 
            content: txt, 
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) 
        });
        localStorage.setItem(key, JSON.stringify(logs));
        document.getElementById('replyMsg').value = "";
        renderChat();
    }

    setInterval(() => { renderLists(); if(activeUser) renderChat(); }, 5000);
    window.onload = renderLists;
</script>
</body>
</html>
