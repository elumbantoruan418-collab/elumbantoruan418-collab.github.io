<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR // SUPREME ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030305; --card: #0d0d1a; --primary: #38bdf8; --accent: #10b981; --red: #ef4444; --sky: #0ea5e9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: white; padding-bottom: 30px; }
        
        .header { background: var(--card); padding: 20px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 16px; color: var(--primary); letter-spacing: 1px; }

        .container { padding: 15px; max-width: 900px; margin: auto; }

        /* TAB SYSTEM */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #151c2c; border: 1px solid #1e293b; color: #64748b; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        .section { display: none; }
        .section.active { display: block; }

        /* GRID SYSTEM UNTUK JB TRACKER (BIAR JADI 2 KOLOM) */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        /* Responsive: Jika layar HP sangat kecil, jadi 1 kolom */
        @media (max-width: 500px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        /* STYLE CARD */
        .item-card { background: var(--card); border-radius: 12px; border: 1px solid #1e293b; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .sku-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        
        .search-box { background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.2); margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 6px; color: var(--primary); outline: none; }

        /* TOMBOL-TOMBOL */
        .btn-wa { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; padding: 8px; background: var(--accent); color: white; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 8px; font-size: 11px; }
        .btn-delete { width: 100%; padding: 8px; background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid var(--red); border-radius: 6px; font-weight: bold; margin-top: 5px; cursor: pointer; font-size: 11px; transition: 0.3s; }
        .btn-delete:hover { background: var(--red); color: white; }

        /* VPS ORDER CARD */
        .order-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--sky); }
        .bukti-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin: 10px 0; border: 1px solid #333; }
        textarea { width: 100%; background: #000; color: #38bdf8; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 11px; }

        .empty { text-align: center; opacity: 0.3; padding: 40px 0; font-size: 12px; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-shield-halved"></i> XTR ADMIN PANEL</h1>
        <div id="clock" style="font-size: 11px; color: var(--accent);"></div>
    </div>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('vps', this)"><i class="fas fa-server"></i> VPS</button>
            <button class="tab-btn" onclick="switchTab('jb', this)"><i class="fas fa-shopping-cart"></i> TRACKER JB</button>
        </div>

        <div id="section-vps" class="section active">
            <div id="orderList"></div>
        </div>

        <div id="section-jb" class="section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari Kode SKU atau Deskripsi..." onkeyup="searchJB()">
            </div>
            <div id="adminListJB" class="grid-container">
                </div>
        </div>
    </div>

    <script>
        // --- PINDAH TAB ---
        function switchTab(type, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('section-' + type).classList.add('active');
            
            if(type === 'vps') loadVpsOrders();
            if(type === 'jb') searchJB();
        }

        // --- FITUR HAPUS BARANG (JB) ---
        function deleteJB(id) {
            if(confirm("Hapus postingan ini?")) {
                let dataJB = JSON.parse(localStorage.getItem("dataJB")) || [];
                // Filter untuk membuang ID yang dipilih
                let newData = dataJB.filter(item => item.id != id); 
                localStorage.setItem("dataJB", JSON.stringify(newData));
                searchJB(); // Refresh tampilan
            }
        }

        // --- FITUR PENCARIAN & TAMPILAN JB (2 KOLOM) ---
        function searchJB() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const listJB = JSON.parse(localStorage.getItem("dataJB")) || [];
            const container = document.getElementById('adminListJB');
            
            const filtered = listJB.filter(item => 
                (item.sku && item.sku.toLowerCase().includes(input)) || 
                (item.deskripsi && item.deskripsi.toLowerCase().includes(input))
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">TIDAK ADA DATA</div>';
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="item-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="sku-badge">#${item.sku || 'N/A'}</span>
                        <small style="font-size:8px; opacity:0.5;">${item.waktu || ''}</small>
                    </div>
                    
                    <div style="margin:10px 0; flex-grow: 1;">
                        <p style="color:var(--primary); font-weight:bold; font-size:13px;">Rp ${Number(item.harga).toLocaleString()}</p>
                        <p style="opacity:0.7; font-size:11px; margin-top:5px; line-height:1.4;">${item.deskripsi}</p>
                        <p style="margin-top:8px; font-size:10px; color:var(--accent);">
                             <i class="fas fa-user"></i> ${item.nomerPenjual || 'No HP Hilang'}
                        </p>
                    </div>

                    <div>
                        <a href="https://wa.me/${item.nomerPenjual}?text=Halo, ada pembeli SKU: ${item.sku}" class="btn-wa">
                            <i class="fab fa-whatsapp"></i> CHAT
                        </a>
                        <button class="btn-delete" onclick="deleteJB('${item.id}')">
                            <i class="fas fa-trash"></i> HAPUS
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- LOGIC VPS ---
        function loadVpsOrders() {
            const container = document.getElementById("orderList");
            const orders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty">BELUM ADA ORDER VPS</div>';
                return;
            }

            container.innerHTML = orders.map((o, i) => `
                <div class="order-card">
                    <div style="font-size:11px;">
                        <span style="color:var(--primary)">User:</span> ${o.nomor} <br>
                        <span style="color:var(--primary)">Plan:</span> ${o.paket}
                    </div>
                    <img src="${o.bukti}" class="bukti-img" onclick="window.open(this.src)">
                    <textarea id="note-${i}" placeholder="Detail login vps..."></textarea>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button onclick="handleAction(${i}, 'ACC')" style="flex:1; background:var(--accent); border:none; padding:10px; border-radius:5px; font-weight:bold;">APPROVE</button>
                        <button onclick="handleAction(${i}, 'REJECT')" style="flex:1; background:var(--red); border:none; color:white; padding:10px; border-radius:5px; font-weight:bold;">REJECT</button>
                    </div>
                </div>
            `).join("");
        }

        function handleAction(index, type) {
            let orders = JSON.parse(localStorage.getItem("vpsOrders"));
            let note = document.getElementById(`note-${index}`).value;
            let logs = JSON.parse(localStorage.getItem("vpsLogs")) || [];
            
            logs.unshift({
                owner: orders[index].nomor,
                paket: orders[index].paket,
                status: type === 'ACC' ? 'sukses' : 'gagal',
                pesan: note || (type === 'ACC' ? 'Aktif' : 'Ditolak'),
                waktu: new Date().toLocaleString()
            });

            localStorage.setItem("vpsLogs", JSON.stringify(logs));
            orders.splice(index, 1);
            localStorage.setItem("vpsOrders", JSON.stringify(orders));
            loadVpsOrders();
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        
        // Jalankan pencarian otomatis saat buka tab JB
        searchJB();
    </script>
</body>
</html>
