<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR // SUPREME ADMIN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030305; --card: #0d0d1a; --primary: #38bdf8; --accent: #10b981; --red: #ef4444; --sky: #0ea5e9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: white; padding-bottom: 30px; }
        
        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 16px; color: var(--primary); }

        .container { padding: 15px; max-width: 800px; margin: auto; }

        /* TAB SYSTEM */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #151c2c; border: 1px solid #1e293b; color: #64748b; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        .section { display: none; }
        .section.active { display: block; }

        /* SEARCH BOX */
        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--primary); border-radius: 8px; color: var(--primary); outline: none; }

        /* GRID SYSTEM (Dua Kolom) */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        .item-card { 
            background: var(--card); 
            border-radius: 10px; 
            border: 1px solid #1e293b; 
            padding: 10px; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
        }

        .sku-badge { background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        
        .item-img { 
            width: 100%; 
            aspect-ratio: 16/9; 
            object-fit: cover; 
            border-radius: 6px; 
            margin: 8px 0; 
            border: 1px solid #222;
        }

        .price { color: var(--accent); font-weight: bold; font-size: 13px; margin: 5px 0; }
        .desc { font-size: 11px; opacity: 0.7; height: 32px; overflow: hidden; }

        /* BUTTONS */
        .btn-group { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .btn-wa { background: var(--accent); color: white; border: none; padding: 8px; border-radius: 5px; text-decoration: none; font-size: 11px; text-align: center; font-weight: bold; }
        .btn-del { background: var(--red); color: white; border: none; padding: 8px; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; }

        .empty { text-align: center; opacity: 0.3; padding: 40px 0; grid-column: span 2; }

        /* Responsive satu kolom di HP sangat kecil */
        @media (max-width: 400px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-shield-halved"></i> ADMIN XTR</h1>
        <div id="clock" style="font-size: 11px;"></div>
    </div>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('jb', this)"><i class="fas fa-tags"></i> KELOLA JUALAN</button>
            <button class="tab-btn" onclick="switchTab('vps', this)"><i class="fas fa-tasks"></i> VPS ORDERS</button>
        </div>

        <div id="section-jb" class="section active">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari Kode SKU (Contoh: XTR-28970)..." onkeyup="searchJB()">
            </div>
            
            <div id="adminListJB" class="grid-container">
                </div>
        </div>

        <div id="section-vps" class="section">
            <div id="orderList">
                <div class="empty">Tidak ada antrian VPS</div>
            </div>
        </div>
    </div>

    <script>
        // --- NAVIGASI TAB ---
        function switchTab(type, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('section-' + type).classList.add('active');
            if(type === 'jb') searchJB();
        }

        // --- FUNGSI CARI & TAMPILKAN JUALAN ---
        function searchJB() {
            const input = document.getElementById('searchInput').value.toUpperCase();
            const listJB = JSON.parse(localStorage.getItem("dataJB")) || [];
            const container = document.getElementById('adminListJB');
            
            // Filter berdasarkan SKU atau Deskripsi
            const filtered = listJB.filter(item => 
                (item.sku && item.sku.toUpperCase().includes(input)) || 
                (item.deskripsi && item.deskripsi.toLowerCase().includes(input.toLowerCase()))
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">Data tidak ditemukan / Kosong</div>';
                return;
            }

            container.innerHTML = filtered.map((item, index) => `
                <div class="item-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="sku-badge">${item.sku}</span>
                    </div>
                    
                    <img src="${item.gambar || 'https://via.placeholder.com/150'}" class="item-img">
                    
                    <div class="price">Rp ${Number(item.harga).toLocaleString()}</div>
                    <div class="desc">${item.deskripsi.substring(0, 40)}...</div>
                    
                    <div style="font-size:10px; margin-top:5px; color:var(--sky)">
                        <i class="fas fa-user"></i> Seller: ${item.nomerPenjual}
                    </div>

                    <div class="btn-group">
                        <a href="https://wa.me/${item.nomerPenjual}?text=Halo, Admin mau cek SKU: ${item.sku}" class="btn-wa">
                            <i class="fab fa-whatsapp"></i> CHAT SELLER
                        </a>
                        <button class="btn-del" onclick="hapusJualan('${item.sku}')">
                            <i class="fas fa-trash"></i> HAPUS
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- FUNGSI HAPUS JUALAN ---
        function hapusJualan(sku) {
            if(confirm("Yakin ingin menghapus kode " + sku + "?")) {
                let listJB = JSON.parse(localStorage.getItem("dataJB")) || [];
                // Hapus item yang SKU-nya cocok
                listJB = listJB.filter(item => item.sku !== sku);
                localStorage.setItem("dataJB", JSON.stringify(listJB));
                
                alert("Berhasil dihapus!");
                searchJB(); // Refresh tampilan
            }
        }

        // Jam Realtime
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Load data saat pertama buka
        window.onload = searchJB;
    </script>
