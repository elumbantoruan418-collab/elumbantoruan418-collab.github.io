<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR COMMAND PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1118; --sidebar: #151d27; --primary: #38bdf8; --accent: #22c55e; --danger: #ef4444; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 320px; min-width: 320px; background: var(--sidebar); 
            display: flex; flex-direction: column; border-right: 1px solid #2d3748; height: 100%;
            transition: 0.3s;
        }

        .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
        .section-label { 
            padding: 12px 15px; background: rgba(56, 189, 248, 0.1); color: var(--primary); 
            font-family: 'Rajdhani'; font-size: 13px; display: flex; justify-content: space-between; 
            position: sticky; top: 0; z-index: 10; backdrop-filter: blur(5px);
        }

        .item-card { 
            background: #1e293b; padding: 14px; border-radius: 10px; margin-bottom: 10px; 
            cursor: pointer; border-left: 4px solid #475569; transition: 0.2s;
        }
        .item-card.active { border-left-color: var(--primary); background: #2b5278; }
        .item-card.order-active { border-left-color: var(--accent); }

        /* --- MAIN AREA --- */
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); height: 100%; position: relative; }
        
        /* Header Chat dengan Tombol Back */
        .chat-header {
            padding: 15px 20px; background: var(--sidebar); border-bottom: 1px solid #2d3748; 
            display: flex; align-items: center; gap: 15px;
        }
        .btn-back { 
            display: none; /* Sembunyi di Desktop */
            font-size: 20px; color: var(--primary); cursor: pointer; padding: 5px 10px; 
        }

        #msgArea { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; 
            background-image: radial-gradient(circle, #1e293b22 1px, transparent 1px); background-size: 20px 20px;
        }

        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .msg.user { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 4px; }
        .msg.admin { align-self: flex-end; background: #0284c7; border-bottom-right-radius: 4px; }

        /* --- INPUT FIX --- */
        .input-wrapper { 
            padding: 15px; background: var(--sidebar); border-top: 1px solid #2d3748;
            padding-bottom: calc(15px + env(safe-area-inset-bottom)); 
        }
        .input-bar { display: flex; gap: 10px; align-items: center; }
        textarea { 
            flex: 1; height: 50px; background: #0b1118; border: 2px solid #2d3748; 
            border-radius: 12px; color: #fff; padding: 12px; resize: none; outline: none; font-size: 14px;
        }
        .btn-send { 
            width: 60px; height: 50px; background: var(--primary); border: none; 
            border-radius: 12px; cursor: pointer; font-size: 20px; color: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .sidebar { position: absolute; z-index: 100; width: 100%; }
            .sidebar.collapsed { transform: translateX(-100%); }
            .btn-back { display: block; } /* Muncul di HP */
            .main { width: 100%; }
        }

        .admin-controls { padding: 10px; display: flex; gap: 8px; background: #0f172a; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        .btn-action { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-family: 'Rajdhani'; font-size: 14px; text-transform: uppercase; }
        .btn-acc { background: var(--accent); color: #000; }
        .btn-rej { background: var(--danger); color: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="section-label"><span><i class="fas fa-comments"></i> CHAT USERS</span></div>
        <div class="scroll-area" id="chatUsersList"></div>

        <div class="section-label">
            <span><i class="fas fa-shopping-cart"></i> ORDER QUEUE</span>
            <span id="orderCount" style="background:var(--danger); padding:2px 8px; border-radius:10px; font-size: 11px;">0</span>
        </div>
        <div class="scroll-area" id="orderQueueList" style="flex: 0.6;"></div>

        <div class="admin-controls">
            <button class="btn-action btn-acc" onclick="processOrder('ACC')">Approve</button>
            <button class="btn-action btn-rej" onclick="processOrder('REJ')">Reject</button>
        </div>
    </div>

    <div class="main">
        <div id="noSelect" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.15;">
            <i class="fas fa-terminal fa-5x"></i>
            <h2 style="font-family:'Rajdhani'; margin-top: 15px;">XTR COMMAND</h2>
        </div>

        <div id="chatContent" class="hidden" style="height:100%; display:flex; flex-direction:column;">
            <div class="chat-header">
                <i class="fas fa-arrow-left btn-back" onclick="backToList()"></i>
                <div style="flex:1">
                    <strong id="headName" style="font-family:'Rajdhani'; font-size:18px; color:var(--primary)">USER</strong>
                    <p style="font-size:10px; color:var(--accent);"><i class="fas fa-circle" style="font-size:7px;"></i> Terminal Active</p>
                </div>
                <i class="fas fa-trash-alt" onclick="clearChat()" style="color:var(--danger); opacity:0.6; padding:5px;"></i>
            </div>
            
            <div id="msgArea"></div>
            
            <div class="input-wrapper">
                <div class="input-bar">
                    <textarea id="replyMsg" placeholder="Type transmission..."></textarea>
                    <button class="btn-send" onclick="sendAdminMsg()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

<script>
    let activeUser = "";

    function renderLists() {
        const chatList = document.getElementById('chatUsersList');
        const orderList = document.getElementById('orderQueueList');
        const contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        const orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];

        document.getElementById('orderCount').innerText = orders.length;

        chatList.innerHTML = contacts.map(id => `
            <div class="item-card ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}')">
                <h5 style="font-family:'Rajdhani'">${id}</h5>
                <p style="font-size:10px; opacity:0.5;">Open Session</p>
            </div>`).join("");

        orderList.innerHTML = orders.map(id => `
            <div class="item-card order-active ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}')">
                <h5 style="color:var(--accent); font-family:'Rajdhani'">${id} <i class="fas fa-bolt"></i></h5>
                <p style="font-size:10px; opacity:0.6;">Pending Approval</p>
            </div>`).join("") || '<p style="text-align:center; opacity:0.2; font-size:11px; padding:20px;">Queue Clear</p>';
    }

    function selectUser(id) {
        activeUser = id;
        document.getElementById('noSelect').classList.add('hidden');
        document.getElementById('chatContent').classList.remove('hidden');
        document.getElementById('headName').innerText = id;
        
        // Sembunyikan sidebar di HP setelah pilih user
        if(window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
        
        renderChat();
        renderLists();
    }

    function backToList() {
        document.getElementById('sidebar').classList.remove('collapsed');
    }

    function renderChat() {
        if(!activeUser) return;
        const area = document.getElementById('msgArea');
        const logs = JSON.parse(localStorage.getItem(`chat_with_${activeUser}`)) || [];
        area.innerHTML = logs.map(m => `
            <div class="msg ${m.sender === 'ADMIN_WINZ' ? 'admin' : 'user'}">
                ${m.content}
            </div>`).join("");
        area.scrollTop = area.scrollHeight;
    }

    function sendAdminMsg() {
        const txt = document.getElementById('replyMsg').value.trim();
        if(!txt || !activeUser) return;
        saveAndPush(txt);
        document.getElementById('replyMsg').value = "";
    }

    function processOrder(type) {
        if(!activeUser) return alert("Pilih user!");
        let input = (type === 'ACC') ? prompt("DATA AKUN:") : prompt("ALASAN REJECT:");
        if(input === null) return;
        let resMsg = (type === 'ACC') ? `✅ APPROVED!\n${input}` : `❌ REJECTED!\n${input}`;
        saveAndPush(resMsg);

        // Hapus dari order queue
        let orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];
        localStorage.setItem("xtr_orders", JSON.stringify(orders.filter(id => id !== activeUser)));

        // Tambah ke kontak chat jika belum ada
        let contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        if(!contacts.includes(activeUser)) {
            contacts.push(activeUser);
            localStorage.setItem("xtr_contacts", JSON.stringify(contacts));
        }
        renderLists();
    }

    function saveAndPush(msg) {
        let key = `chat_with_${activeUser}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        logs.push({ sender: "ADMIN_WINZ", content: msg });
        localStorage.setItem(key, JSON.stringify(logs));
        renderChat();
    }

    function clearChat() {
        if(confirm("Hapus history?")) {
            localStorage.removeItem(`chat_with_${activeUser}`);
            renderChat();
        }
    }

    setInterval(renderLists, 5000);
    window.onload = renderLists;
</script>
</body>
</html>
