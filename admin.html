<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz // ADMIN TERMINAL - XTR SYSTEM</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05050a; 
            --card: #0d0d1a; 
            --primary: #38bdf8; 
            --accent: #22c55e; 
            --danger: #ef4444; 
            --text: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Rajdhani', sans-serif; 
            padding: 20px;
            background-image: radial-gradient(circle at top right, #1e1e38 0%, #05050a 100%);
        }

        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; padding-bottom: 20px; margin-bottom: 25px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
        .mode-tag { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--primary); background: rgba(56, 189, 248, 0.1); padding: 4px 10px; border-radius: 5px; margin-top: 5px; display: inline-block; }

        /* SEARCH */
        .search-input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid #1e293b; 
            border-radius: 12px; color: #fff; outline: none; font-family: 'JetBrains Mono'; margin-bottom: 20px;
        }

        /* ORDER CARD */
        .order-card { 
            background: var(--card); border-radius: 18px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid #1e1e38; position: relative;
        }

        .account-box { 
            background: rgba(0,0,0,0.4); border: 1px solid rgba(56, 189, 248, 0.2); 
            padding: 12px; border-radius: 10px; margin: 15px 0; font-family: 'JetBrains Mono'; font-size: 12px;
        }
        .label { color: var(--primary); font-weight: bold; }

        .bukti-img { width: 100%; border-radius: 12px; margin: 10px 0; border: 1px solid #333; cursor: pointer; }
        
        textarea { 
            width: 100%; background: #000; color: #fff; border: 1px solid #1e293b; 
            padding: 12px; border-radius: 10px; margin-bottom: 15px; font-family: 'JetBrains Mono'; font-size: 12px; resize: none;
        }

        .btn-group { display: flex; gap: 10px; }
        .btn-acc { flex: 3; background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 800; }
        .btn-rej { flex: 1; background: var(--danger); color: #fff; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>WINZ ADMIN PANEL</h2>
        <div class="mode-tag"><i class="fas fa-bolt"></i> REAL-TIME QUEUE CLEANER</div>
    </div>

    <input type="text" id="adminSearch" class="search-input" placeholder="Cari Username/Paket..." onkeyup="filterOrders()">

    <div id="orderList"></div>
</div>

<script>
    function loadOrders() {
        const container = document.getElementById("orderList");
        // AMBIL DATA DARI LOCAL STORAGE
        let orders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        
        if (orders.length === 0) {
            container.innerHTML = "<center style='opacity:0.3; margin-top:80px;'>-- TIDAK ADA ANTRIAN --</center>";
            return;
        }

        // Tampilkan pesanan (Terbaru di atas)
        container.innerHTML = orders.slice().reverse().map((o, index) => {
            // Karena kita me-reverse, index asli di array 'orders' harus dihitung ulang
            const realIndex = (orders.length - 1) - index;
            const displayID = o.orderID || `XTR-${Date.now() + realIndex}`;
            
            return `
            <div class="order-card" id="order-${realIndex}">
                <div style="font-size:16px; font-weight:bold; color:var(--primary); margin-bottom:10px;">
                    <i class="fas fa-server"></i> ${o.paket}
                </div>

                <div class="account-box">
                    <div><span class="label">USER:</span> ${o.user}</div>
                    <div><span class="label">PASS:</span> ${o.pw || '******'}</div>
                    <div><span class="label">ID:</span> #${displayID}</div>
                </div>
                
                <img src="${o.bukti}" class="bukti-img" onclick="window.open(this.src)">
                
                <textarea id="note-${realIndex}" placeholder="Input IP/Login detail..."></textarea>
                
                <div class="btn-group">
                    <button class="btn-acc" onclick="handleAction(${realIndex}, 'ACC', '${displayID}')">SETUJU</button>
                    <button class="btn-rej" onclick="handleAction(${realIndex}, 'REJECT', '${displayID}')">TOLAK</button>
                </div>
            </div>`;
        }).join("");
    }

    function handleAction(index, tipe, orderID) {
        // 1. Ambil data terbaru dari storage
        let orders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        let logs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        
        // 2. Ambil item yang mau diproses
        let item = orders[index];
        if (!item) return; // Proteksi kalau data sudah hilang

        let note = document.getElementById(`note-${index}`).value || (tipe === 'ACC' ? "Pesanan Aktif" : "Ditolak Admin");

        // 3. Masukkan ke LOG AKTIVITAS (Biar muncul di aktivitas.html user)
        logs.unshift({
            owner: item.user,
            orderID: orderID,
            teks: tipe === 'ACC' ? `🚀 SUCCESS: ${item.paket} | Note: ${note}` : `❌ REJECTED: ${item.paket} | Alasan: ${note}`,
            waktu: new Date().toLocaleString('id-ID'),
            status: tipe === 'ACC' ? 'sukses' : 'gagal'
        });

        // 4. HAPUS PERMANEN DARI ANTRIAN
        orders.splice(index, 1);

        // 5. UPDATE SEMUA KE LOCAL STORAGE (INI YANG PENTING!)
        localStorage.setItem("aktivitasLogs", JSON.stringify(logs));
        localStorage.setItem("vpsOrders", JSON.stringify(orders));

        // 6. Refresh tampilan
        alert(`Order #${orderID} Berhasil di-${tipe} dan dihapus dari antrian.`);
        loadOrders();
    }

    function filterOrders() {
        let val = document.getElementById("adminSearch").value.toLowerCase();
        let cards = document.getElementsByClassName("order-card");
        for(let c of cards) { c.style.display = c.innerText.toLowerCase().includes(val) ? "block" : "none"; }
    }

    loadOrders();
    // Refresh otomatis tiap 10 detik biar sinkron
    setInterval(loadOrders, 10000);
</script>
</body>
</html>
