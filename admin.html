<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR // ADMIN TERMINAL</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #030305; --card: #0d0d1a; --primary: #38bdf8; --accent: #10b981; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: white; padding: 20px; }
        
        .header { border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; color: var(--primary); }

        /* Search Box */
        .search-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.3); margin-bottom: 25px; }
        .search-box input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        
        /* Result Card */
        .item-card { background: var(--card); border-radius: 15px; border: 1px solid #1e293b; padding: 20px; margin-bottom: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .sku-badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .detail-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 15px 0; }
        .detail-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 5px 0; font-size: 13px; }
        .label { color: #64748b; }
        
        /* Action Buttons */
        .btn-wa { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn-wa:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-del { width: 100%; padding: 10px; background: transparent; color: var(--red); border: 1px solid var(--red); border-radius: 10px; margin-top: 10px; cursor: pointer; font-size: 12px; }

        .empty { text-align: center; opacity: 0.4; padding: 50px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-user-shield"></i> WINZ ADMIN</h1>
        <span style="font-size: 10px; opacity: 0.5;">v.2.0.6</span>
    </div>

    <div class="search-box">
        <label style="font-size: 11px; margin-bottom: 8px; display: block;">TRACKING BARANG / SKU</label>
        <input type="text" id="searchInput" placeholder="Ketik Kode Unik (Contoh: XTR-12345)" onkeyup="searchProduct()">
    </div>

    <div id="adminList">
        </div>

    <script>
        function searchProduct() {
            const input = document.getElementById('searchInput').value.toUpperCase();
            const listJB = JSON.parse(localStorage.getItem("dataJB")) || [];
            const container = document.getElementById('adminList');
            
            // Filter berdasarkan SKU atau Deskripsi
            const filtered = listJB.filter(item => 
                item.sku.toUpperCase().includes(input) || 
                item.deskripsi.toLowerCase().includes(input.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty"><i class="fas fa-search"></i><p>Barang tidak ditemukan.</p></div>';
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="item-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="sku-badge">${item.sku}</span>
                        <small style="font-size:10px; opacity:0.5;">${item.waktu}</small>
                    </div>
                    
                    <div class="detail-grid">
                        <div class="detail-row">
                            <span class="label">Harga:</span>
                            <span style="color:var(--primary)">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Deskripsi:</span>
                            <span>${item.deskripsi.substring(0, 50)}...</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Nomor Penjual:</span>
                            <span style="color:var(--accent); font-weight:bold;">+${item.nomerPenjual}</span>
                        </div>
                    </div>

                    <a href="https://wa.me/${item.nomerPenjual}?text=Halo Penjual, ada yang nanya barang Kode: ${item.sku}. Apakah masih ada?" class="btn-wa">
                        <i class="fab fa-whatsapp"></i> CHAT PENJUAL SEKARANG
                    </a>

                    <button class="btn-del" onclick="deleteItem(${item.id})">Hapus Data</button>
                </div>
            `).join('');
        }

        function deleteItem(id) {
            if(confirm("Hapus postingan ini dari database?")) {
                let listJB = JSON.parse(localStorage.getItem("dataJB")) || [];
                listJB = listJB.filter(i => i.id !== id);
                localStorage.setItem("dataJB", JSON.stringify(listJB));
                searchProduct(); // Refresh list
            }
        }

        // Jalankan render awal
        searchProduct();
    </script>
</body>
</html>
