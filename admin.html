<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Winz // ADMIN TERMINAL</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #070711; --card: #121220; --primary: #38bdf8; --accent: #22c55e; --danger: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 15px; margin-bottom: 20px; }
        
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        .search-input { 
            width: 100%; padding: 12px 15px 12px 45px; background: #000; border: 1px solid var(--primary); 
            border-radius: 10px; color: white; outline: none; box-sizing: border-box; font-family: 'JetBrains Mono';
        }

        .order-card { background: var(--card); border-radius: 15px; padding: 18px; margin-bottom: 20px; border-left: 5px solid var(--primary); }
        .order-id-tag { float: right; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--primary); opacity: 0.8; }
        .user-tag { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; margin-bottom: 10px; display: inline-block; }
        .bukti-img { width: 100%; border-radius: 10px; margin: 12px 0; border: 1px solid #333; }
        textarea { width: 100%; background: #050510; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-family: 'JetBrains Mono'; font-size: 12px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-acc { flex: 3; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 800; }
        .btn-rej { flex: 1; background: var(--danger); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>WINZ ADMIN PANEL</h2>
    </div>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="adminSearch" class="search-input" placeholder="Cari ID (#WINZ...), No WA, atau Produk..." onkeyup="filterOrders()">
    </div>

    <div id="orderList"></div>
</div>

<script>
    // Generator ID yang SAMA dengan Log User
    function generateOrderID(index, total) {
        let seed = (total - index) + 1000;
        return `WINZ-${seed}XTR`;
    }

    function filterOrders() {
        const keyword = document.getElementById("adminSearch").value.toLowerCase();
        const cards = document.getElementsByClassName("order-card");
        for (let card of cards) {
            card.style.display = card.innerText.toLowerCase().includes(keyword) ? "block" : "none";
        }
    }

    function loadOrders() {
        const container = document.getElementById("orderList");
        const orders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        
        if (orders.length === 0) {
            container.innerHTML = "<center style='opacity:0.5; margin-top:50px;'>TIDAK ADA ANTRIAN</center>";
            return;
        }

        container.innerHTML = orders.map((o, i) => {
            const orderID = generateOrderID(i, orders.length);
            return `
            <div class="order-card">
                <span class="order-id-tag">#${orderID}</span>
                <div class="user-tag"><i class="fas fa-user"></i> ${o.nomor}</div>
                <div style="font-size:14px; margin:5px 0;"><b>PRODUK:</b> ${o.paket}</div>
                <div style="font-size:14px; margin:5px 0;"><b>TARGET:</b> ${o.target || o.nomor}</div>
                
                <img src="${o.bukti}" class="bukti-img" onclick="window.open(this.src)">
                
                <textarea id="note-${i}" placeholder="Tulis catatan..."></textarea>
                
                <div class="btn-group">
                    <button class="btn-acc" onclick="handleAction(${i}, 'ACC', '${orderID}')">ACC</button>
                    <button class="btn-rej" onclick="handleAction(${i}, 'REJECT', '${orderID}')">REJECT</button>
                </div>
            </div>`;
        }).join("");
    }

    function handleAction(index, tipe, orderID) {
        let orders = JSON.parse(localStorage.getItem("vpsOrders"));
        let item = orders[index];
        let note = document.getElementById(`note-${index}`).value || "Proses Selesai";

        let logs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        
        // Simpan ke database Log dengan ID yang sudah dibuat
        logs.unshift({
            owner: item.nomor,
            orderID: orderID, // ID DISIMPAN PERMANEN
            teks: tipe === 'ACC' ? `🚀 BERHASIL: ${item.paket} | Note: ${note}` : `❌ GAGAL: ${item.paket} | Alasan: ${note}`,
            waktu: new Date().toLocaleString(),
            status: tipe === 'ACC' ? 'sukses' : 'gagal'
        });

        localStorage.setItem("aktivitasLogs", JSON.stringify(logs));
        orders.splice(index, 1);
        localStorage.setItem("vpsOrders", JSON.stringify(orders));

        alert(`ID ${orderID} Berhasil di-${tipe}`);
        loadOrders();
    }

    loadOrders();
</script>
</body>
</html>
