<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz // XTR COMMAND</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1118; --sidebar: #151d27; --primary: #38bdf8; --accent: #22c55e; --danger: #ef4444; --text: #fff; }
        
        /* Reset Standar - Bisa Scroll */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; display: flex; 
            height: 100vh; overflow: hidden; 
        }

        /* Sidebar Standar - Scroll Aktif */
        .sidebar { 
            width: 300px; min-width: 300px; background: var(--sidebar); 
            display: flex; flex-direction: column; border-right: 1px solid #2d3748; 
        }
        .list-wrapper { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }

        .section-label { 
            padding: 12px 15px; background: rgba(56, 189, 248, 0.1); 
            color: var(--primary); font-family: 'Rajdhani'; font-size: 13px; 
            display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 5;
        }

        .item-card { 
            background: #1e293b; padding: 12px; border-radius: 8px; 
            margin-bottom: 8px; cursor: pointer; border-left: 4px solid #475569;
        }
        .item-card.active { border-left-color: var(--primary); background: #2b5278; }
        .item-card.order-active { border-left-color: var(--accent); }

        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        #msgArea { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

        /* Bubble Chat */
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 15px; font-size: 13px; position: relative; word-wrap: break-word; }
        .msg.user { align-self: flex-start; background: #1e293b; color: #fff; }
        .msg.admin { align-self: flex-end; background: #0284c7; color: #fff; }

        /* INPUT AREA NAIK (Anti-Meleset) */
        .input-container { 
            padding: 15px; background: var(--sidebar); border-top: 1px solid #2d3748;
            padding-bottom: 30px; /* POSISI DINAIKKAN KE ATAS */
        }
        .input-bar { display: flex; gap: 10px; align-items: center; }
        
        textarea { 
            flex: 1; height: 55px; background: #0b1118; border: 2px solid #2d3748; 
            border-radius: 12px; color: #fff; padding: 12px; resize: none; outline: none; font-size: 14px;
        }
        textarea:focus { border-color: var(--primary); }

        .btn-send { 
            width: 70px; height: 55px; background: var(--primary); border: none; 
            border-radius: 12px; cursor: pointer; font-size: 22px; color: #000;
            display: flex; align-items: center; justify-content: center;
        }

        /* Tombol ACC/REJ */
        .admin-controls { padding: 10px; display: flex; gap: 8px; background: #0f172a; border-top: 1px solid #2d3748; }
        .btn-action { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-family: 'Rajdhani'; cursor: pointer; font-size: 14px; letter-spacing: 1px; }
        .btn-acc { background: var(--accent); color: #000; }
        .btn-rej { background: var(--danger); color: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="section-label"><span><i class="fas fa-comments"></i> CHAT USERS</span></div>
        <div class="list-wrapper" id="chatUsersList"></div>

        <div class="section-label">
            <span><i class="fas fa-shopping-cart"></i> ORDER QUEUE</span>
            <span id="orderCount" style="background:var(--danger); padding:0 6px; border-radius:10px;">0</span>
        </div>
        <div class="list-wrapper" id="orderQueueList"></div>

        <div class="admin-controls">
            <button class="btn-action btn-acc" onclick="processOrder('ACC')">APPROVE</button>
            <button class="btn-action btn-rej" onclick="processOrder('REJ')">REJECT</button>
        </div>
    </div>

    <div class="main">
        <div id="noSelect" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.1;">
            <i class="fas fa-terminal fa-5x"></i>
            <h2 style="font-family:'Rajdhani'">WINZ XTR SYSTEM</h2>
        </div>

        <div id="chatContent" class="hidden" style="height:100%; display:flex; flex-direction:column;">
            <div style="padding:15px; background:var(--sidebar); border-bottom:1px solid #2d3748; display:flex; justify-content:space-between; align-items:center;">
                <strong id="headName" style="font-family:'Rajdhani'; font-size:18px; color:var(--primary)">USER</strong>
                <i class="fas fa-trash-alt" onclick="clearChat()" style="color:var(--danger); cursor:pointer; padding:10px;"></i>
            </div>
            
            <div id="msgArea"></div>
            
            <div class="input-container">
                <div class="input-bar">
                    <textarea id="replyMsg" placeholder="Tulis instruksi..."></textarea>
                    <button class="btn-send" onclick="sendAdminMsg()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

<script>
    let activeUser = "";

    function renderLists() {
        const chatList = document.getElementById('chatUsersList');
        const orderList = document.getElementById('orderQueueList');
        const contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        const orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];

        document.getElementById('orderCount').innerText = orders.length;

        chatList.innerHTML = contacts.map(id => `
            <div class="item-card ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}')">
                <h5>${id}</h5>
            </div>`).join("") || '<p style="text-align:center; opacity:0.2; font-size:12px; margin-top:10px;">No Chats</p>';

        orderList.innerHTML = orders.map(id => `
            <div class="item-card order-active ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}')">
                <h5 style="color:var(--accent)">${id} <i class="fas fa-bolt"></i></h5>
                <p style="font-size:10px; color:#94a3b8;">Menunggu Konfirmasi...</p>
            </div>`).join("") || '<p style="text-align:center; opacity:0.2; font-size:12px; margin-top:10px;">Queue Empty</p>';
    }

    function selectUser(id) {
        activeUser = id;
        document.getElementById('noSelect').classList.add('hidden');
        document.getElementById('chatContent').classList.remove('hidden');
        document.getElementById('headName').innerText = id;
        renderChat();
        renderLists();
    }

    function renderChat() {
        if(!activeUser) return;
        const area = document.getElementById('msgArea');
        const logs = JSON.parse(localStorage.getItem(`chat_with_${activeUser}`)) || [];
        area.innerHTML = logs.map((m, i) => `
            <div class="msg ${m.sender === 'ADMIN_WINZ' ? 'admin' : 'user'}">
                ${m.content}
            </div>`).join("");
        area.scrollTop = area.scrollHeight;
    }

    function processOrder(type) {
        if(!activeUser) return alert("Pilih user dulu!");
        
        let input = (type === 'ACC') ? prompt("Detail Akun (User/Pass/IP):") : prompt("Alasan Rejection:");
        if(input === null) return;

        let resMsg = (type === 'ACC') ? `✅ ORDER COMPLETED!\n\n${input}` : `❌ ORDER REJECTED!\n\nAlasan: ${input}`;
        
        // Simpan Pesan ke Chat
        let key = `chat_with_${activeUser}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        logs.push({ sender: "ADMIN_WINZ", content: resMsg });
        localStorage.setItem(key, JSON.stringify(logs));

        // --- OTOMATIS HAPUS DARI ANTRIAN (SOLUSI BIAR GAK DOUBLE) ---
        let orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];
        let newOrders = orders.filter(id => id !== activeUser);
        localStorage.setItem("xtr_orders", JSON.stringify(newOrders));

        // Tambahkan ke Kontak Chat Utama
        let contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        if(!contacts.includes(activeUser)) {
            contacts.push(activeUser);
            localStorage.setItem("xtr_contacts", JSON.stringify(contacts));
        }

        alert(`User ${activeUser} Berhasil di-${type}!`);
        renderLists();
        renderChat();
    }

    function sendAdminMsg() {
        const txt = document.getElementById('replyMsg').value.trim();
        if(!txt || !activeUser) return;
        let key = `chat_with_${activeUser}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        logs.push({ sender: "ADMIN_WINZ", content: txt });
        localStorage.setItem(key, JSON.stringify(logs));
        document.getElementById('replyMsg').value = "";
        renderChat();
    }

    function clearChat() {
        if(confirm("Wipe history user ini?")) {
            localStorage.removeItem(`chat_with_${activeUser}`);
            renderChat();
        }
    }

    // Refresh list sesekali biar sinkron
    setInterval(renderLists, 5000);
    window.onload = renderLists;
</script>
</body>
</html>
