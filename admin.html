<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Winz // ADMIN TERMINAL</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #070711; --card: #121220; --primary: #38bdf8; --accent: #22c55e; --danger: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .order-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .bukti-img { width: 100%; border-radius: 8px; margin: 10px 0; border: 1px solid #333; }
        .btn-acc { background: var(--accent); color: black; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 70%; }
        .btn-rej { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 25%; }
        textarea { width: 100%; background: #000; color: white; border: 1px solid #333; padding: 8px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>ADMIN XTR TERMINAL</h2></div>
    <div id="orderList"></div>
</div>

<script>
    function loadOrders() {
        const container = document.getElementById("orderList");
        const orders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        if (orders.length === 0) { container.innerHTML = "<center>NO PENDING ORDERS</center>"; return; }

        container.innerHTML = orders.map((o, i) => `
            <div class="order-card">
                <b>Target:</b> ${o.nomor} <br>
                <b>Produk:</b> ${o.paket} <br>
                <b>Waktu:</b> ${o.waktu} <br>
                <img src="${o.bukti}" class="bukti-img">
                <textarea id="note-${i}" placeholder="Ulasan Admin..."></textarea>
                <div style="display:flex; gap:5%">
                    <button class="btn-acc" onclick="handleAction(${i}, 'ACC')">ACC</button>
                    <button class="btn-rej" onclick="handleAction(${i}, 'REJECT')">REJECT</button>
                </div>
            </div>
        `).join("");
    }

    function handleAction(index, tipe) {
        let orders = JSON.parse(localStorage.getItem("vpsOrders"));
        let item = orders[index];
        let note = document.getElementById(`note-${index}`).value || "Proses Selesai";

        let logs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        
        // PRIVATISASI: Simpan owner berdasarkan nomor HP pengirim
        logs.unshift({
            owner: item.nomor, 
            teks: tipe === 'ACC' ? `🚀 AKTIF: ${item.paket} | Note: ${note}` : `❌ DITOLAK: ${item.paket} | Alasan: ${note}`,
            waktu: new Date().toLocaleString(),
            status: tipe === 'ACC' ? 'sukses' : 'gagal'
        });

        localStorage.setItem("aktivitasLogs", JSON.stringify(logs));
        orders.splice(index, 1);
        localStorage.setItem("vpsOrders", JSON.stringify(orders));

        alert("Action Berhasil!");
        loadOrders();
    }
    loadOrders();
</script>
</body>
</html>
