<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Winz // ADMIN XTR MESSENGER PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0e1621; --sidebar: #17212b; --hover: #202b36; --active: #2b5278; --text: #ffffff; --primary: #38bdf8; --accent: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 350px; background: var(--sidebar); border-right: 1px solid #000; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #0e1621; }
        .search-container { background: #242f3d; padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; }
        .search-container input { background: transparent; border: none; color: white; margin-left: 10px; outline: none; width: 100%; font-size: 14px; }
        .chat-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #242f3d transparent; }
        
        .chat-item { padding: 12px 15px; display: flex; align-items: center; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #0e1621; position: relative; }
        .chat-item:hover { background: var(--hover); }
        .chat-item.active { background: var(--active); }
        .avatar { width: 45px; height: 45px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #000; margin-right: 15px; position: relative; }
        
        /* Badge Pending */
        .pending-dot { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; background: var(--accent); border: 2px solid var(--sidebar); border-radius: 50%; }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0e1621; position: relative; }
        .chat-header { padding: 10px 20px; background: var(--sidebar); display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .message-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        /* Bubbles */
        .msg { max-width: 80%; padding: 12px; border-radius: 12px; font-size: 14px; position: relative; line-height: 1.4; animation: slideUp 0.2s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.user { align-self: flex-start; background: var(--sidebar); border-bottom-left-radius: 2px; }
        .msg.admin { align-self: flex-end; background: var(--active); border-bottom-right-radius: 2px; }
        
        .order-box { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px; margin-top: 8px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .order-img { width: 100%; border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 1px solid #333; transition: 0.3s; }
        .order-img:hover { filter: brightness(1.2); }
        
        .order-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-acc { background: var(--accent); color: black; border: none; padding: 10px; border-radius: 5px; flex: 1; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-rej { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 5px; flex: 1; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-acc:hover { background: #1eb050; transform: scale(1.02); }
        .btn-rej:hover { background: #d63d3d; transform: scale(1.02); }

        .input-area { padding: 15px; background: var(--sidebar); display: flex; gap: 10px; align-items: center; border-top: 1px solid #000; }
        .input-area textarea { flex: 1; background: #242f3d; border: none; border-radius: 12px; color: white; padding: 12px; outline: none; resize: none; height: 45px; font-family: inherit; }
        .btn-send { background: var(--primary); color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; transition: 0.3s; }
        .btn-send:hover { transform: rotate(-15deg) scale(1.1); }

        .msg-time { font-size: 10px; color: #7f91a4; margin-top: 5px; display: block; text-align: right; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchUser" placeholder="Search ID Target..." onkeyup="renderUserList()">
            </div>
        </div>
        <div class="chat-list" id="userList"></div>
    </div>

    <div class="main-chat">
        <div id="noChat" style="flex:1; display:flex; align-items:center; justify-content:center; color:#7f91a4; flex-direction: column;">
            <i class="fas fa-comments-alt fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i>
            <h3>Select chat to start process</h3>
        </div>

        <div id="chatContent" class="hidden" style="height:100%; display:flex; flex-direction:column;">
            <div class="chat-header">
                <div class="avatar" id="currentAvatar">W</div>
                <div style="flex: 1;">
                    <h4 id="currentUserName">User</h4>
                    <span style="font-size:11px; color:var(--primary);"><i class="fas fa-shield-check"></i> XTR Verified Admin</span>
                </div>
            </div>

            <div class="message-area" id="msgArea"></div>

            <div class="input-area">
                <textarea id="replyText" placeholder="Write a reply or notes..."></textarea>
                <button class="btn-send" onclick="sendReply()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

<script>
    let activeUser = null;
    let lastOrderCount = (JSON.parse(localStorage.getItem("vpsOrders")) || []).length;

    function renderUserList() {
        const list = document.getElementById('userList');
        const searchTerm = document.getElementById('searchUser').value.toLowerCase();
        const allOrders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        const allLogs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        
        // Gabungkan list user dari antrian dan riwayat
        const users = [...new Set([...allOrders.map(o => o.nomor), ...allLogs.map(l => l.owner)])];
        const filtered = users.filter(u => u.toLowerCase().includes(searchTerm));

        list.innerHTML = filtered.map(u => {
            const hasPending = allOrders.some(o => o.nomor === u);
            return `
            <div class="chat-item ${activeUser === u ? 'active' : ''}" onclick="selectUser('${u}')">
                <div class="avatar">
                    ${u.charAt(0).toUpperCase()}
                    ${hasPending ? '<div class="pending-dot"></div>' : ''}
                </div>
                <div class="chat-info">
                    <h4>${u}</h4>
                    <p style="color:${hasPending ? 'var(--primary)' : '#7f91a4'}">${hasPending ? 'Pending Order' : 'History Cleared'}</p>
                </div>
            </div>`;
        }).join("");
    }

    function selectUser(user) {
        activeUser = user;
        document.getElementById('noChat').classList.add('hidden');
        document.getElementById('chatContent').classList.remove('hidden');
        document.getElementById('currentUserName').innerText = user;
        document.getElementById('currentAvatar').innerText = user.charAt(0).toUpperCase();
        renderMessages();
        renderUserList();
    }

    function renderMessages() {
        if (!activeUser) return;
        const msgArea = document.getElementById('msgArea');
        const allOrders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        const allLogs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];

        let history = [];
        
        // Filter Order User
        allOrders.filter(o => o.nomor === activeUser).forEach((o, i) => {
            history.push({ 
                type: 'user', 
                text: o.isiPesan || `Order Produk: ${o.paket}`, 
                bukti: o.bukti,
                orderID: o.orderID || 'XTR-AUTO',
                time: o.waktu, 
                id: i, 
                isOrder: !o.paket.includes("💬")
            });
        });

        // Filter Balasan Admin
        allLogs.filter(l => l.owner === activeUser).forEach((l, i) => {
            history.push({ type: 'admin', text: l.teks, time: l.waktu, id: i });
        });

        history.sort((a, b) => new Date(a.time) - new Date(b.time));

        const newContent = history.map((m) => `
            <div class="msg ${m.type}">
                ${m.text}
                ${m.isOrder ? `
                    <div class="order-box">
                        <img src="${m.bukti}" class="order-img" title="Klik Lihat Bukti" onclick="window.open(this.src)">
                        <div class="order-actions">
                            <button class="btn-acc" onclick="processHybrid(${m.id}, 'ACC', '${m.orderID}')">SETUJUI</button>
                            <button class="btn-rej" onclick="processHybrid(${m.id}, 'REJECT', '${m.orderID}')">TOLAK</button>
                        </div>
                    </div>
                ` : ''}
                <span class="msg-time">${m.time}</span>
            </div>
        `).join("");

        // Cek jika ada pesan baru sebelum scroll
        if (msgArea.innerHTML !== newContent) {
            msgArea.innerHTML = newContent;
            msgArea.scrollTop = msgArea.scrollHeight;
        }
    }

    function processHybrid(index, tipe, orderID) {
        let orders = JSON.parse(localStorage.getItem("vpsOrders"));
        let item = orders[index];
        let note = prompt(`Konfirmasi ${tipe}: Masukkan IP/Username atau Alasan:`, tipe === 'ACC' ? "Aktif (XTR-V1)" : "Data Tidak Valid");
        
        if (note === null) return; 

        let logs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        logs.push({
            owner: item.nomor,
            orderID: orderID,
            teks: tipe === 'ACC' ? `✅ DISETUJUI: ${item.paket} | Login Info: ${note}` : `❌ DITOLAK: ${item.paket} | Alasan: ${note}`,
            waktu: new Date().toLocaleString('id-ID'),
            status: tipe === 'ACC' ? 'sukses' : 'gagal'
        });

        localStorage.setItem("aktivitasLogs", JSON.stringify(logs));
        orders.splice(index, 1);
        localStorage.setItem("vpsOrders", JSON.stringify(orders));
        
        renderMessages();
        renderUserList();
    }

    function sendReply() {
        const textInput = document.getElementById('replyText');
        const text = textInput.value.trim();
        if (!text || !activeUser) return;

        let logs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        logs.push({
            owner: activeUser,
            teks: text,
            waktu: new Date().toLocaleString('id-ID'),
            status: 'sukses'
        });

        localStorage.setItem("aktivitasLogs", JSON.stringify(logs));
        textInput.value = "";
        renderMessages();
    }

    // Auto Refresh & Notifikasi
    setInterval(() => {
        const currentOrders = JSON.parse(localStorage.getItem("vpsOrders")) || [];
        if (currentOrders.length > lastOrderCount) {
            document.getElementById('notifSound').play();
            lastOrderCount = currentOrders.length;
        }
        renderUserList();
        renderMessages();
    }, 4000);

    renderUserList();
</script>
</body>
</html>
