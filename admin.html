<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Winz // XTR COMMAND CENTER</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1118; --sidebar: #151d27; --hover: #1c2733; --active: #2b5278; --text: #ffffff; --primary: #38bdf8; --accent: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Structure */
        .sidebar { width: 350px; background: var(--sidebar); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; height: 100vh; }
        .section-label { padding: 12px 15px; background: rgba(56, 189, 248, 0.1); color: var(--primary); font-family: 'Rajdhani'; font-weight: bold; font-size: 13px; letter-spacing: 1px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); display: flex; justify-content: space-between; align-items: center; }

        /* List Container */
        .list-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .list-container::-webkit-scrollbar { width: 3px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--primary); }

        /* Card Design */
        .item-card { 
            background: #1e293b; border-left: 4px solid #475569; padding: 12px; border-radius: 6px; 
            cursor: pointer; transition: 0.3s; position: relative;
        }
        .item-card:hover { background: var(--hover); transform: translateX(5px); }
        .item-card.active { background: var(--active); border-left-color: var(--primary); }
        .item-card.order-active { border-left-color: var(--accent); }
        
        .item-card h5 { font-size: 13px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .item-card p { font-size: 11px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Main Chat Area */
        .main { flex: 1; display: flex; flex-direction: column; background: #0b1118; border-left: 1px solid rgba(255,255,255,0.05); }
        .chat-header { padding: 15px 20px; background: var(--sidebar); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 38px; height: 38px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        #msgArea { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: radial-gradient(circle at top right, #1e293b33, transparent); }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 13px; position: relative; line-height: 1.5; }
        .msg.user { align-self: flex-start; background: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; }
        .msg.admin { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }

        /* Tools */
        .msg-tools { position: absolute; top: -20px; right: 0; display: none; gap: 8px; background: #0f172a; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--primary); }
        .msg:hover .msg-tools { display: flex; }
        .tool-btn { cursor: pointer; font-size: 10px; color: var(--primary); }

        /* Controls */
        .admin-controls { padding: 12px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 11px; font-family: 'Rajdhani'; transition: 0.3s; }
        .btn-acc { background: var(--accent); color: #052e16; }
        .btn-rej { background: var(--danger); color: #fff; }

        .input-bar { padding: 15px; background: var(--sidebar); display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        textarea { flex: 1; background: #0b1118; border: 1px solid #2d3748; border-radius: 10px; color: white; padding: 12px; height: 45px; resize: none; outline: none; }
        .btn-send { background: var(--primary); border: none; width: 45px; border-radius: 10px; cursor: pointer; color: #000; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="section-label">
            <span><i class="fas fa-comments"></i> CHAT USERS</span>
        </div>
        <div class="list-container" id="chatUsersList"></div>

        <div class="section-label">
            <span><i class="fas fa-shopping-cart"></i> ORDER QUEUE</span>
            <span id="orderCount" style="background:var(--danger); font-size:9px; padding:2px 6px; border-radius:10px;">0</span>
        </div>
        <div class="list-container" id="orderQueueList"></div>

        <div class="admin-controls">
            <button class="btn-action btn-acc" onclick="processOrder('ACC')"><i class="fas fa-check"></i> ACC</button>
            <button class="btn-action btn-rej" onclick="processOrder('REJ')"><i class="fas fa-times"></i> REJECT</button>
        </div>
    </div>

    <div class="main">
        <div id="noSelect" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.3;">
            <i class="fas fa-terminal fa-3x"></i>
            <h4 style="margin-top:10px; font-family:'Rajdhani'">XTR ADMIN TERMINAL</h4>
        </div>

        <div id="chatContent" class="hidden" style="height:100%; display:flex; flex-direction:column;">
            <div class="chat-header">
                <div class="avatar" id="headAva">W</div>
                <div style="flex:1">
                    <h4 id="headName" style="font-size:14px; font-family:'Rajdhani';">USER ID</h4>
                    <small id="statusLabel" style="font-size:10px; color:var(--accent);">Active Session</small>
                </div>
                <i class="fas fa-trash-alt" onclick="clearChat()" style="cursor:pointer; color:var(--danger); opacity:0.6;"></i>
            </div>
            <div id="msgArea"></div>
            <div class="input-bar">
                <textarea id="replyMsg" placeholder="Type message..."></textarea>
                <button class="btn-send" onclick="sendAdminMsg()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

<script>
    let activeUser = "";

    function renderLists() {
        const chatList = document.getElementById('chatUsersList');
        const orderList = document.getElementById('orderQueueList');
        
        const contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        const orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];

        document.getElementById('orderCount').innerText = orders.length;

        chatList.innerHTML = contacts.map(id => {
            const logs = JSON.parse(localStorage.getItem(`chat_with_${id}`)) || [];
            const last = logs.length > 0 ? logs[logs.length-1].content : "No messages";
            return `
                <div class="item-card ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}', 'chat')">
                    <h5>${id}</h5>
                    <p>${last}</p>
                </div>`;
        }).join("");

        orderList.innerHTML = orders.map(id => `
            <div class="item-card order-active ${activeUser === id ? 'active' : ''}" onclick="selectUser('${id}', 'order')">
                <h5 style="color:var(--accent)">${id} <i class="fas fa-clock"></i></h5>
                <p>Waiting for approval...</p>
            </div>`).join("");
    }

    function selectUser(id, type) {
        activeUser = id;
        document.getElementById('noSelect').classList.add('hidden');
        document.getElementById('chatContent').classList.remove('hidden');
        document.getElementById('headName').innerText = id;
        document.getElementById('headAva').innerText = id[0].toUpperCase();
        document.getElementById('statusLabel').innerText = (type === 'order') ? 'Awaiting Approval' : 'Active Chat';
        renderChat();
        renderLists();
    }

    function renderChat() {
        if(!activeUser) return;
        const area = document.getElementById('msgArea');
        const logs = JSON.parse(localStorage.getItem(`chat_with_${activeUser}`)) || [];
        area.innerHTML = logs.map((m, i) => `
            <div class="msg ${m.sender === 'ADMIN_WINZ' ? 'admin' : 'user'}">
                <div class="msg-tools">
                    <i class="fas fa-pen tool-btn" onclick="editChat(${i})"></i>
                    <i class="fas fa-trash tool-btn" onclick="deleteChat(${i})"></i>
                </div>
                ${m.content}
                <div style="font-size:8px; opacity:0.4; margin-top:5px; text-align:right;">${m.time}</div>
            </div>`).join("");
        area.scrollTop = area.scrollHeight;
    }

    // LOGIKA PROSES ORDER (Sinkron ke aktivitas.html)
    function processOrder(type) {
        if(!activeUser) return alert("Pilih user dulu Winz!");
        
        let input = (type === 'ACC') ? prompt("Detail Login (VPS/User/Pass):") : prompt("Alasan Penolakan:");
        if(input === null) return;

        let resMsg = (type === 'ACC') ? `✅ ORDER APPROVED!\nInfo: ${input}` : `❌ ORDER REJECTED!\nAlasan: ${input}`;
        
        // 1. Kirim pesan ke chat history
        pushMsg(resMsg);

        // 2. Simpan ke database aktivitas (xtr_aktivitas)
        let aktivitas = JSON.parse(localStorage.getItem("xtr_aktivitas")) || [];
        aktivitas.unshift({
            waktu: new Date().toLocaleString('id-ID'),
            user: activeUser,
            tipe: type,
            detail: input,
            status: type === 'ACC' ? 'Selesai' : 'Dibatalkan'
        });
        localStorage.setItem("xtr_aktivitas", JSON.stringify(aktivitas));

        // 3. Hapus dari Order Queue biar gak double
        let orders = JSON.parse(localStorage.getItem("xtr_orders")) || [];
        const orderIdx = orders.indexOf(activeUser);
        if (orderIdx > -1) {
            orders.splice(orderIdx, 1);
            localStorage.setItem("xtr_orders", JSON.stringify(orders));
        }

        // 4. Pastikan masuk ke Chat Users list
        let contacts = JSON.parse(localStorage.getItem("xtr_contacts")) || [];
        if (!contacts.includes(activeUser)) {
            contacts.push(activeUser);
            localStorage.setItem("xtr_contacts", JSON.stringify(contacts));
        }

        alert(`User ${activeUser} berhasil di-${type}! Log masuk ke aktivitas.`);
        renderLists();
    }

    function sendAdminMsg() {
        const txt = document.getElementById('replyMsg').value.trim();
        if(!txt || !activeUser) return;
        pushMsg(txt);
        document.getElementById('replyMsg').value = "";
    }

    function pushMsg(txt) {
        const key = `chat_with_${activeUser}`;
        let logs = JSON.parse(localStorage.getItem(key)) || [];
        logs.push({ 
            sender: "ADMIN_WINZ", 
            content: txt, 
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) 
        });
        localStorage.setItem(key, JSON.stringify(logs));
        renderChat();
    }

    function deleteChat(index) {
        let logs = JSON.parse(localStorage.getItem(`chat_with_${activeUser}`));
        logs.splice(index, 1);
        localStorage.setItem(`chat_with_${activeUser}`, JSON.stringify(logs));
        renderChat();
    }

    function editChat(index) {
        let logs = JSON.parse(localStorage.getItem(`chat_with_${activeUser}`));
        let up = prompt("Edit Pesan:", logs[index].content);
        if(up) {
            logs[index].content = up;
            localStorage.setItem(`chat_with_${activeUser}`, JSON.stringify(logs));
            renderChat();
        }
    }

    function clearChat() {
        if(confirm("Hapus history user ini?")) {
            localStorage.removeItem(`chat_with_${activeUser}`);
            renderChat();
        }
    }

    setInterval(() => { renderLists(); if(activeUser) renderChat(); }, 3000);
    window.onload = renderLists;
</script>
</body>
</html>
