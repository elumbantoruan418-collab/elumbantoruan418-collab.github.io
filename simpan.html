<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTR MARKET</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #f5f5f5; 
            --primary: #ee4d2d; 
            --text-main: #222;
            --text-sub: #757575;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            padding-bottom: 20px;
        }

        /* Sticky Header */
        .header { 
            position: sticky; top: 0; z-index: 100;
            text-align: center; 
            padding: 15px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 8px;
        }
        .header h2 { color: var(--primary); font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px; }

        /* Grid System */
        #marketList {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 6px; 
            padding: 6px;
        }

        /* Kartu Produk - SEKARANG ADALAH LINK (<a>) */
        .product-card { 
            background: white; 
            border-radius: 4px; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            text-decoration: none; /* Hilangkan garis bawah link */
            color: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .product-card:active { background: #fafafa; }

        /* Slider Image Container */
        .img-slider { 
            position: relative;
            width: 100%;
            padding-top: 100%; /* Ratio 1:1 */
            background: #f9f9f9;
            overflow: hidden;
        }

        /* Container dalam untuk foto-foto yang bisa di-scroll */
        .slides {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Hilangkan scrollbar Firefox */
        }
        .slides::-webkit-scrollbar { display: none; } /* Hilangkan scrollbar Chrome/Safari */

        .slides img { 
            min-width: 100%; 
            height: 100%; 
            object-fit: cover; 
            scroll-snap-align: start; 
        }

        /* Indikator Jumlah Foto */
        .img-counter {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.5);
            color: white; font-size: 10px;
            padding: 2px 6px; border-radius: 10px;
            z-index: 5;
        }

        /* Info Produk */
        .info { padding: 8px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .sku-box { font-size: 9px; color: #26aa99; font-weight: 700; margin-bottom: 4px; }

        .product-title { 
            font-size: 13px; font-weight: 500; color: #333;
            line-height: 1.3; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis;
            min-height: 34px;
        }

        .desc { 
            font-size: 11px; color: #757575;
            margin-bottom: 8px;
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price { 
            font-size: 15px; font-weight: 700; color: var(--primary); 
            margin-top: auto; 
        }

        /* Tombol Visual (Tetap ada biar user tau bisa dibeli) */
        .btn-fake {
            margin-top: 10px;
            background: var(--primary);
            color: white; text-align: center;
            padding: 8px; border-radius: 2px;
            font-size: 11px; font-weight: 700;
        }

        .empty-state { grid-column: span 2; text-align: center; padding: 100px 20px; color: #bbb; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-shopping-bag"></i> XTR MARKET</h2>
    </div>

    <div id="marketList">
        </div>

    <script>
        const ADMIN_WA = "639319692180"; 

        function renderMarket() {
            const container = document.getElementById('marketList');
            const list = JSON.parse(localStorage.getItem("dataJB")) || [];

            if(list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open fa-3x"></i>
                        <p style="margin-top:10px;">Belum ada produk tersedia.</p>
                    </div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                const itemSKU = item.sku || "XTR-" + Math.floor(Math.random() * 90000);
                const itemTitle = item.judul || "Akun Game / Produk XTR"; // Ambil judul jika ada
                const harga = item.harga ? parseInt(item.harga).toLocaleString('id-ID') : '0';
                
                // Urusi banyak foto
                const fotoArray = (item.fotos && item.fotos.length > 0) ? item.fotos : ['https://via.placeholder.com/300'];
                const imgHtml = fotoArray.map(f => `<img src="${f}" loading="lazy">`).join('');
                const counterHtml = fotoArray.length > 1 ? `<div class="img-counter">1/${fotoArray.length}</div>` : '';

                return `
                <a href="https://wa.me/${ADMIN_WA}?text=Halo Admin, saya mau beli produk ini:%0A%0AJudul: ${itemTitle}%0AKode: ${itemSKU}%0AHarga: Rp ${harga}" 
                   class="product-card" target="_blank">
                    
                    <div class="img-slider">
                        <div class="slides">
                            ${imgHtml}
                        </div>
                        ${counterHtml}
                    </div>

                    <div class="info">
                        <div class="sku-box">KODE: ${itemSKU}</div>
                        <h3 class="product-title">${itemTitle}</h3>
                        <p class="desc">${item.deskripsi || ''}</p>
                        <div class="price">Rp ${harga}</div>
                        <div class="btn-fake">BELI SEKARANG</div>
                    </div>
                </a>
                `;
            }).reverse().join('');

            // Logika untuk ganti angka counter foto saat di-scroll (opsional)
            document.querySelectorAll('.slides').forEach(slider => {
                slider.addEventListener('scroll', function() {
                    const index = Math.round(this.scrollLeft / this.offsetWidth) + 1;
                    const counter = this.parentElement.querySelector('.img-counter');
                    if(counter) {
                        const total = this.querySelectorAll('img').length;
                        counter.innerText = `${index}/${total}`;
                    }
                });
            });
        }

        document.addEventListener("DOMContentLoaded", renderMarket);
    </script>
</body>
</html>
