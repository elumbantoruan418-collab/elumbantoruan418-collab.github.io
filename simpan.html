<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTR MARKET // Katalog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #f5f5f5; --primary: #ee4d2d; --text-main: #222; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- UI UTAMA --- */
        .header { position: sticky; top: 0; z-index: 100; text-align: center; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header h2 { color: var(--primary); font-size: 1.1rem; font-weight: 800; }
        #marketList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }

        .product-card { background: white; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .img-card { position: relative; width: 100%; padding-top: 100%; background: #eee; }
        .img-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 8px; flex-grow: 1; }
        .p-title { font-size: 12px; font-weight: 500; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-size: 14px; font-weight: 700; color: var(--primary); margin-top: 5px; }

        /* --- MODAL DETAIL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; overflow-y: auto; }
        .modal-header { position: sticky; top: 0; background: white; padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; z-index: 1100; }
        
        .detail-slider { 
            width: 100%; aspect-ratio: 1/1; background: #000; 
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory; 
            scrollbar-width: none; position: relative;
        }
        .detail-slider::-webkit-scrollbar { display: none; }
        .detail-slider img { 
            min-width: 100%; width: 100%; object-fit: contain; 
            scroll-snap-align: start; transition: transform 0.3s ease; 
            cursor: zoom-in; position: relative;
        }
        .detail-slider img.zoomed { transform: scale(2.0); z-index: 1001; cursor: zoom-out; }

        .detail-info { padding: 20px; }
        .detail-price { font-size: 24px; font-weight: 700; color: var(--primary); }
        .detail-title { font-size: 18px; font-weight: 600; margin: 10px 0; }
        .detail-sku { font-size: 11px; color: #26aa99; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        .detail-desc { font-size: 14px; color: #555; line-height: 1.6; white-space: pre-line; border-top: 1px solid #eee; padding-top: 15px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; padding: 10px; border-top: 1px solid #eee; display: flex; z-index: 1100; }
        .btn-wa { flex: 1; background: var(--primary); color: white; text-align: center; padding: 12px; border-radius: 4px; text-decoration: none; font-weight: 700; }
        .empty-state { grid-column: span 2; text-align: center; padding: 100px 20px; color: #ccc; }
    </style>
</head>
<body>

    <div class="header"><h2><i class="fas fa-shopping-bag"></i> XTR MARKET</h2></div>
    <div id="marketList"></div>

    <div id="productModal" class="modal">
        <div class="modal-header">
            <i class="fas fa-arrow-left" style="cursor:pointer" onclick="closeDetail()"></i>
            <span style="font-weight: 600; margin-left: 10px;">Detail Produk</span>
        </div>
        <div id="detailSlider" class="detail-slider"></div>
        <div class="detail-info">
            <div id="detailPrice" class="detail-price"></div>
            <div id="detailTitle" class="detail-title"></div>
            <div id="detailSKU" class="detail-sku"></div>
            <div id="detailDesc" class="detail-desc"></div>
        </div>
        <div style="height: 80px;"></div> 
        <div class="bottom-nav"><a id="btnBeli" href="#" class="btn-wa" target="_blank">BELI SEKARANG</a></div>
    </div>

    <script>
        const ADMIN_WA = "639319692180"; 
        let currentProducts = [];
        let autoSlideInterval;
        let slideIndex = 0;

        function renderMarket() {
            const container = document.getElementById('marketList');
            const rawData = JSON.parse(localStorage.getItem("dataJB")) || [];
            currentProducts = [...rawData].reverse();

            if(currentProducts.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>Belum ada produk.</p></div>`;
                return;
            }

            container.innerHTML = currentProducts.map((item, index) => {
                const cover = (item.fotos && item.fotos.length > 0) ? item.fotos[0] : 'https://via.placeholder.com/150';
                return `
                <div class="product-card" onclick="openDetail(${index})">
                    <div class="img-card"><img src="${cover}"></div>
                    <div class="info">
                        <p class="p-title">${item.judul || 'Produk XTR'}</p>
                        <p class="p-price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function openDetail(index) {
            const item = currentProducts[index];
            const modal = document.getElementById('productModal');
            const slider = document.getElementById('detailSlider');
            
            // 1. Setup Slider & Reset Index
            slider.innerHTML = item.fotos.map(f => `<img src="${f}" onclick="toggleZoom(this)">`).join('');
            slider.scrollLeft = 0;
            slideIndex = 0;

            // 2. Tampilkan Data
            const harga = parseInt(item.harga).toLocaleString('id-ID');
            document.getElementById('detailPrice').innerText = `Rp ${harga}`;
            document.getElementById('detailTitle').innerText = item.judul;
            document.getElementById('detailSKU').innerText = `KODE: ${item.sku || 'XTR'}`;
            document.getElementById('detailDesc').innerText = item.deskripsi;
            document.getElementById('btnBeli').href = `https://wa.me/${ADMIN_WA}?text=Halo Admin, mau beli ${item.judul} (Kode: ${item.sku})`;

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';

            // 3. Jalankan Auto Slide (Diberi delay sedikit agar ClientWidth terbaca)
            clearInterval(autoSlideInterval);
            if (item.fotos.length > 1) {
                setTimeout(() => {
                    const width = slider.clientWidth;
                    autoSlideInterval = setInterval(() => {
                        const isZoomed = slider.querySelector('.zoomed');
                        if (!isZoomed) {
                            slideIndex++;
                            if (slideIndex >= item.fotos.length) slideIndex = 0;
                            slider.scrollTo({ left: width * slideIndex, behavior: 'smooth' });
                        }
                    }, 3500);
                }, 100);
            }
        }

        function toggleZoom(img) { 
            const slider = document.getElementById('detailSlider');
            if(img.classList.contains('zoomed')) {
                img.classList.remove('zoomed');
                slider.style.overflowX = "auto";
            } else {
                slider.querySelectorAll('img').forEach(i => i.classList.remove('zoomed'));
                img.classList.add('zoomed');
                slider.style.overflowX = "hidden";
            }
        }

        function closeDetail() {
            clearInterval(autoSlideInterval);
            document.getElementById('productModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = renderMarket;
    </script>
</body>
</html>
