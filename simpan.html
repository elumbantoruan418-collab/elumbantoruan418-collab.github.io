<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTR MARKET</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #f5f5f5; 
            --primary: #ee4d2d; 
            --text-main: #222;
            --text-sub: #757575;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; }

        /* --- UI UTAMA --- */
        .header { position: sticky; top: 0; z-index: 100; text-align: center; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header h2 { color: var(--primary); font-size: 1.1rem; font-weight: 800; }

        #marketList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }

        .product-card { background: white; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .img-card { position: relative; width: 100%; padding-top: 100%; background: #eee; }
        .img-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .info { padding: 8px; }
        .p-title { font-size: 12px; font-weight: 500; color: #333; height: 34px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 5px; }
        .p-price { font-size: 14px; font-weight: 700; color: var(--primary); }

        /* --- MODAL DETAIL (Popup ala Shopee) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; overflow-y: auto; }
        
        .modal-header { position: sticky; top: 0; background: white; padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; z-index: 10; }
        .btn-back { font-size: 20px; cursor: pointer; color: var(--text-main); }

        .detail-slider { width: 100%; aspect-ratio: 1/1; background: #000; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; }
        .detail-slider img { min-width: 100%; object-fit: contain; scroll-snap-align: start; }

        .detail-info { padding: 20px; }
        .detail-price { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .detail-title { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 15px; }
        .detail-desc { font-size: 14px; color: #555; line-height: 1.6; white-space: pre-line; border-top: 1px solid #eee; padding-top: 15px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; padding: 10px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .btn-wa { flex: 1; background: var(--primary); color: white; text-align: center; padding: 12px; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-shopping-bag"></i> XTR MARKET</h2>
    </div>

    <div id="marketList"></div>

    <div id="productModal" class="modal">
        <div class="modal-header">
            <i class="fas fa-arrow-left btn-back" onclick="closeDetail()"></i>
            <span style="font-weight: 600;">Detail Produk</span>
        </div>
        
        <div id="detailSlider" class="detail-slider"></div>
        
        <div class="detail-info">
            <div id="detailPrice" class="detail-price"></div>
            <div id="detailTitle" class="detail-title"></div>
            <div id="detailSKU" style="font-size: 11px; color: #26aa99; font-weight: 700; margin-bottom: 10px;"></div>
            <div id="detailDesc" class="detail-desc"></div>
        </div>

        <div style="height: 80px;"></div> <div class="bottom-nav">
            <a id="btnBeli" href="#" class="btn-wa">
                <i class="fab fa-whatsapp"></i> BELI SEKARANG
            </a>
        </div>
    </div>

    <script>
        const ADMIN_WA = "639319692180"; 
        let currentProducts = [];

        function renderMarket() {
            const container = document.getElementById('marketList');
            currentProducts = JSON.parse(localStorage.getItem("dataJB")) || [];

            if(currentProducts.length === 0) {
                container.innerHTML = `<p style="grid-column:span 2; text-align:center; padding:50px;">Kosong...</p>`;
                return;
            }

            container.innerHTML = currentProducts.map((item, index) => {
                const cover = (item.fotos && item.fotos.length > 0) ? item.fotos[0] : 'https://via.placeholder.com/150';
                return `
                <div class="product-card" onclick="openDetail(${index})">
                    <div class="img-card">
                        <img src="${cover}">
                    </div>
                    <div class="info">
                        <p class="p-title">${item.judul || 'Produk XTR'}</p>
                        <p class="p-price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</p>
                    </div>
                </div>
                `;
            }).reverse().join('');
        }

        function openDetail(index) {
            const item = currentProducts.reverse()[index]; // Re-reverse karena di render kita balik
            currentProducts.reverse(); // Balikin lagi ke asal

            const modal = document.getElementById('productModal');
            const slider = document.getElementById('detailSlider');
            const hargaFormatted = parseInt(item.harga).toLocaleString('id-ID');

            // Isi Foto Slider
            slider.innerHTML = item.fotos.map(f => `<img src="${f}">`).join('');
            
            // Isi Info
            document.getElementById('detailPrice').innerText = `Rp ${hargaFormatted}`;
            document.getElementById('detailTitle').innerText = item.judul || 'Produk XTR';
            document.getElementById('detailSKU').innerText = `KODE: ${item.sku || 'XTR-UNKNOWN'}`;
            document.getElementById('detailDesc').innerText = item.deskripsi || '';

            // Set Link WhatsApp sesuai format permintaanmu
            const pesan = `Halo Admin, saya mau beli barang ini:%0A%0AKode: ${item.sku}%0AHarga: Rp ${hargaFormatted}%0A%0AHubungkan saya dengan penjual.`;
            document.getElementById('btnBeli').href = `https://wa.me/${ADMIN_WA}?text=${pesan}`;

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Kunci scroll layar utama
        }

        function closeDetail() {
            document.getElementById('productModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = renderMarket;
    </script>
</body>
</html>
