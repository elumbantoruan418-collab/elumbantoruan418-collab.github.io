<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XTR MARKETPLACE</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #f5f5f5; 
            --card: #ffffff; 
            --primary: #ee4d2d; 
            --text-main: #222;
            --text-sub: #757575;
            --accent: #26aa99; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            padding: 8px; 
        }

        /* Header Shopee Style */
        .header { 
            text-align: center; 
            margin-bottom: 12px; 
            padding: 15px;
            background: white;
            border-bottom: 2px solid var(--primary);
            border-radius: 4px;
        }
        .header h2 { color: var(--primary); font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* Grid 2 Kolom Persis Shopee */
        #marketList {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
        }

        .product-card { 
            background: var(--card); 
            border-radius: 4px; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Foto Kotak Presisi */
        .img-container { 
            position: relative;
            width: 100%;
            padding-top: 100%; 
            background: #eee;
        }
        
        .img-container img { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }

        .info { 
            padding: 8px; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .sku-box { 
            font-size: 10px; 
            color: var(--accent); 
            font-weight: bold;
            margin-bottom: 4px;
        }

        .desc { 
            font-size: 12px; 
            color: #333;
            line-height: 1.4; 
            margin-bottom: 8px;
            height: 34px; /* Biar tetap sejajar walau teks pendek */
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price { 
            font-size: 15px; 
            font-weight: 700; 
            color: var(--primary); 
            margin-bottom: 10px; 
        }

        /* Tombol Beli yang Gampang Ditekan */
        .btn-buy { 
            width: 100%; 
            padding: 10px 0; 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            border-radius: 2px; 
            font-size: 11px;
            font-weight: 700; 
            text-decoration: none; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 5px;
            text-align: center;
        }

        .btn-buy:active { opacity: 0.8; }

        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 100px 20px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-shopping-bag"></i> XTR MARKET</h2>
        <p style="font-size: 11px; color: var(--text-sub); margin-top: 5px;">Klik beli untuk hubungi Admin via WhatsApp</p>
    </div>

    <div id="marketList">
        </div>

    <script>
        const ADMIN_WA = "639319692180"; 

        function renderMarket() {
            const container = document.getElementById('marketList');
            
            // 1. Ambil data (Coba panggil 'dataJB')
            let list = JSON.parse(localStorage.getItem("dataJB"));

            // 2. CEK JIKA KOSONG (Kalau kosong, saya kasih contoh data biar gak putih doang)
            if(!list || list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open fa-3x"></i>
                        <p style="margin-top:10px;">Data kosong di LocalStorage.<br>Silakan tambah produk dulu.</p>
                    </div>`;
                return;
            }

            // 3. Render Data
            container.innerHTML = list.map(item => {
                const itemSKU = item.sku || "XTR-" + Math.floor(Math.random() * 90000);
                // Cek apakah ada foto, kalau tidak pakai placeholder
                const coverImg = (item.fotos && item.fotos.length > 0) ? item.fotos[0] : 'https://via.placeholder.com/300?text=No+Image';
                const harga = item.harga ? parseInt(item.harga).toLocaleString('id-ID') : '0';
                
                return `
                <div class="product-card">
                    <div class="img-container">
                        <img src="${coverImg}" alt="Produk">
                    </div>
                    <div class="info">
                        <div class="sku-box">KODE: ${itemSKU}</div>
                        <p class="desc">${item.deskripsi || 'Tidak ada deskripsi.'}</p>
                        <div class="price">Rp ${harga}</div>
                        
                        <a href="https://wa.me/${ADMIN_WA}?text=Halo Admin, saya mau beli:%0A%0AKode: ${itemSKU}%0AHarga: Rp ${harga}" 
                           class="btn-buy" target="_blank">
                            <i class="fab fa-whatsapp"></i> BELI SEKARANG
                        </a>
                    </div>
                </div>
                `;
            }).reverse().join('');
        }

        // Jalankan pas loading
        document.addEventListener("DOMContentLoaded", renderMarket);
    </script>
</body>
</html>
