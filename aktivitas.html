<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz // LOG PRIVAT</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #030305;
            --card-bg: #0d0d1a;
            --blue-glow: #38bdf8;
            --red-glow: #ef4444;
            --text-main: #e5e7eb;
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text-main); font-family: var(--font-display); padding: 30px 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: auto; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
        .header h2 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px var(--blue-glow); }
        
        .user-info { font-family: var(--font-mono); font-size: 10px; color: var(--blue-glow); background: rgba(56, 189, 248, 0.1); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }

        .log-card { 
            background: var(--card-bg); 
            padding: 18px; 
            margin-bottom: 15px; 
            border-radius: 12px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: slideUp 0.4s ease-out;
            border-left: 5px solid var(--blue-glow);
            cursor: pointer;
            transition: 0.3s;
        }
        .log-card:hover { transform: translateY(-3px); background: #121225; }
        .log-card.gagal { border-left: 5px solid var(--red-glow); }

        .order-id { position: absolute; right: 15px; top: 15px; font-family: var(--font-mono); font-size: 10px; color: var(--blue-glow); opacity: 0.6; }
        .time { color: var(--blue-glow); font-family: var(--font-mono); font-size: 11px; display: block; margin-bottom: 10px; opacity: 0.8; }
        .content { font-size: 15px; line-height: 1.5; letter-spacing: 0.5px; word-break: break-word; }

        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: inline-block; font-family: var(--font-mono); }
        .badge-sukses { background: rgba(56, 189, 248, 0.2); color: var(--blue-glow); }
        .badge-gagal { background: rgba(239, 68, 68, 0.2); color: var(--red-glow); }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--blue-glow); border-radius: 16px; width: 100%; max-width: 400px; padding: 25px; position: relative; animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .empty-state { text-align: center; margin-top: 100px; opacity: 0.5; font-family: var(--font-mono); font-size: 13px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <i class="fas fa-user-shield" style="color: var(--blue-glow);"></i>
            <h2>LOG SAYA</h2>
        </div>
        <div id="userBadge" class="user-info">Guest</div>
    </div>
    <div id="logList"></div>
</div>

<div id="logModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modalHeader" style="font-weight:bold; margin-bottom:15px; text-transform:uppercase;"></div>
        <div id="modalBody" style="font-size:14px; font-family:var(--font-mono); color:#ccc;"></div>
    </div>
</div>

<script>
    // Ambil nomor WA yang sedang login
    const sessionUser = localStorage.getItem("winz_session") || "";

    function loadLogs() {
        if (!sessionUser) {
            document.getElementById("logList").innerHTML = `<div class="empty-state">Silahkan login di menu SMM/Script Hub dulu Winz!</div>`;
            return;
        }

        document.getElementById("userBadge").innerText = sessionUser;
        
        const allLogs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        const container = document.getElementById("logList");

        // FILTER: Cuma ambil log yang owner-nya sama dengan sessionUser
        const myLogs = allLogs.filter(log => log.owner === sessionUser);

        if(myLogs.length === 0) {
            container.innerHTML = `<div class="empty-state">Belum ada riwayat aktivitas untuk nomor ini.</div>`;
            return;
        }

        container.innerHTML = myLogs.map((l) => {
            const isGagal = l.status === 'gagal';
            const cardClass = isGagal ? 'log-card gagal' : 'log-card';
            const badgeClass = isGagal ? 'badge-gagal' : 'badge-sukses';
            const badgeText = isGagal ? 'Rejected' : 'Executed';
            const displayID = l.orderID || "WINZ-NEW";

            return `
                <div class="${cardClass}" onclick='showDetail(${JSON.stringify(l)})'>
                    <div class="order-id">#${displayID}</div>
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <span class="time"><i class="far fa-clock"></i> ${l.waktu}</span>
                    <div class="content">${l.teks}</div>
                </div>
            `;
        }).join("");
    }

    function showDetail(data) {
        const modal = document.getElementById('logModal');
        const body = document.getElementById('modalBody');
        const header = document.getElementById('modalHeader');
        const isGagal = data.status === 'gagal';

        header.innerHTML = isGagal ? "Detail Penolakan" : "Detail Aktivitas Sukses";
        header.style.color = isGagal ? "var(--red-glow)" : "var(--blue-glow)";

        body.innerHTML = `
            <div style="margin-bottom:10px;"><b>ID:</b> #${data.orderID || 'N/A'}</div>
            <div style="margin-bottom:10px;"><b>Waktu:</b> ${data.waktu}</div>
            <div style="padding:15px; background:rgba(0,0,0,0.4); border-radius:10px; border:1px solid #333;">
                <b>Catatan Admin:</b><br>
                <span style="color:#fff;">${data.teks}</span>
            </div>
        `;
        modal.style.display = 'flex';
    }

    function closeModal() { document.getElementById('logModal').style.display = 'none'; }

    loadLogs();
    // Refresh otomatis tiap 10 detik buat cek status terbaru dari admin
    setInterval(loadLogs, 10000);
</script>
</body>
</html>
