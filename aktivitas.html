<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz // XTR LOGS SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #030305;
            --card-bg: #0d0d1a;
            --blue-glow: #38bdf8;
            --red-glow: #ef4444;
            --text-main: #e5e7eb;
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: var(--font-display); 
            padding: 25px 15px; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #111122 0%, #030305 100%);
        }

        .container { max-width: 500px; margin: auto; }

        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            margin-bottom: 25px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); 
        }

        .header h2 { 
            font-size: 20px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            text-shadow: 0 0 10px var(--blue-glow); 
        }

        /* Log Card */
        .log-card { 
            background: var(--card-bg); 
            padding: 16px; 
            margin-bottom: 12px; 
            border-radius: 12px;
            position: relative;
            border-left: 4px solid var(--blue-glow);
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.4s ease-out;
            border: 1px solid rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--blue-glow);
        }

        .log-card:hover { 
            transform: translateY(-2px); 
            background: #121225; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .log-card.gagal { border-left-color: var(--red-glow); }

        /* ID Tag */
        .order-id-tag { 
            position: absolute; 
            right: 15px; 
            top: 15px; 
            font-family: var(--font-mono); 
            font-size: 10px; 
            color: var(--blue-glow); 
            opacity: 0.7;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .time { 
            color: #64748b; 
            font-family: var(--font-mono); 
            font-size: 10px; 
            display: block; 
            margin-bottom: 8px; 
        }

        .user-owner {
            font-size: 11px;
            color: #facc15;
            font-family: var(--font-mono);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .content { 
            font-size: 14px; 
            line-height: 1.4; 
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        /* Status Badge */
        .status-badge { 
            font-size: 9px; 
            padding: 2px 7px; 
            border-radius: 4px; 
            text-transform: uppercase; 
            font-weight: bold; 
            margin-bottom: 8px; 
            display: inline-block; 
            font-family: var(--font-mono);
        }
        .badge-sukses { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-gagal { background: rgba(239, 68, 68, 0.2); color: var(--red-glow); }

        /* MODAL */
        .modal { 
            display: none; position: fixed; z-index: 999; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); 
            align-items: center; justify-content: center; padding: 20px; 
        }

        .modal-content { 
            background: var(--card-bg); 
            border: 1px solid var(--blue-glow); 
            border-radius: 15px; 
            width: 100%; max-width: 380px; 
            padding: 25px; position: relative; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .modal-header { border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; }
        .close-btn { position: absolute; right: 15px; top: 15px; color: #fff; font-size: 20px; cursor: pointer; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-microchip"></i> XTR LOGS</h2>
        <div style="font-size: 10px; opacity: 0.5;">LIVE MONITORING</div>
    </div>

    <div id="logList"></div>
</div>

<div id="logModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-header" id="modalTitle">DETAIL</div>
        <div id="modalBody" style="font-family: var(--font-mono); font-size: 13px; color: #94a3b8;"></div>
    </div>
</div>

<script>
    function loadLogs() {
        const container = document.getElementById("logList");
        const logs = JSON.parse(localStorage.getItem("aktivitasLogs")) || [];
        
        if (logs.length === 0) {
            container.innerHTML = `<div style="text-align:center; margin-top:50px; opacity:0.3;">-- NO ACTIVITY RECORDED --</div>`;
            return;
        }

        container.innerHTML = logs.map((l) => {
            const isGagal = (l.status === 'gagal' || l.teks.includes("❌") || l.teks.includes("GAGAL"));
            const cardClass = isGagal ? 'log-card gagal' : 'log-card';
            const badgeClass = isGagal ? 'badge-gagal' : 'badge-sukses';
            const badgeText = isGagal ? 'Rejected' : 'Success';
            
            // Ambil ID pesanan kalau ada, kalau nggak pakai default
            const displayID = l.orderID || 'WNZ-SYS';
            const owner = l.owner || 'UNKNOWN';

            return `
                <div class="${cardClass}" onclick='showDetail(${JSON.stringify(l).replace(/'/g, "&apos;")})'>
                    <span class="order-id-tag">#${displayID}</span>
                    <div class="user-owner"><i class="fas fa-user-circle"></i> ${owner.toUpperCase()}</div>
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <span class="time"><i class="far fa-clock"></i> ${l.waktu}</span>
                    <div class="content">${l.teks}</div>
                </div>
            `;
        }).join("");
    }

    function showDetail(data) {
        const modal = document.getElementById('logModal');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');
        const isGagal = (data.status === 'gagal' || data.teks.includes("❌"));

        title.innerText = isGagal ? "Laporan Penolakan" : "Laporan Berhasil";
        title.style.color = isGagal ? "var(--red-glow)" : "var(--blue-glow)";

        body.innerHTML = `
            <div style="margin-bottom:12px;">
                <b style="color:#fff">ORDER ID:</b><br>
                <span style="color:var(--blue-glow)">#${data.orderID || 'N/A'}</span>
            </div>
            <div style="margin-bottom:12px;">
                <b style="color:#fff">USER:</b><br>
                <span>${(data.owner || 'System').toUpperCase()}</span>
            </div>
            <div style="padding:12px; background:rgba(0,0,0,0.5); border-radius:8px; border:1px solid #333;">
                <b style="color:var(--blue-glow)">KETERANGAN:</b><br>
                <span style="color:#e2e8f0; font-size:12px;">${data.teks}</span>
            </div>
        `;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('logModal').style.display = 'none';
    }

    loadLogs();
    // Auto refresh tiap 10 detik biar sinkron sama Admin Panel
    setInterval(loadLogs, 10000);
</script>
</body>
</html>
