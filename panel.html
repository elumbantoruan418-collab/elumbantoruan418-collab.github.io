<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTR Cloud // Panel VPS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        /* ===== GLOBAL STYLE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #020617;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            color: #e5e7eb;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tombol Kembali */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-back:hover { opacity: 0.7; transform: translateX(-5px); }

        /* ===== MENU BOX CONTAINER ===== */
        .menu-box { 
            max-width: 450px; 
            margin: 0 auto; 
            background: #0d0d1a; 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .menu-box h2 { 
            text-align: center; 
            color: #38bdf8; 
            margin-bottom: 20px; 
            letter-spacing: 2px; 
            font-size: 24px;
            text-transform: uppercase;
        }
        
        /* QRIS SECTION */
        .qris-container { 
            text-align: center; 
            background: #fff; 
            padding: 15px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .qris-container img { 
            width: 100%; 
            max-width: 200px; 
            border-radius: 8px; 
        }
        .qris-container p { 
            color: #0f172a; 
            font-weight: 800; 
            font-size: 12px; 
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* FORM ELEMENTS */
        label { 
            display: block; 
            margin-top: 15px; 
            font-size: 12px; 
            color: #38bdf8; 
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-top: 6px; 
            background: #151c2c; 
            border: 1px solid #1e293b; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 14px;
            outline: none; 
            transition: 0.3s; 
            font-family: sans-serif;
        }
        
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }
        
        #previewBukti { 
            width: 100%; 
            margin-top: 15px; 
            border-radius: 12px; 
            display: none; 
            border: 2px solid #38bdf8; 
        }

        .harga-tag { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 20px; 
            font-weight: bold; 
            color: #38bdf8; 
            background: rgba(56, 189, 248, 0.1); 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px dashed rgba(56,189,248,0.5); 
        }
        
        .status-box { 
            margin-top: 15px; 
            background: rgba(0,0,0,0.4); 
            border: 1px solid #1e293b; 
            border-radius: 10px; 
            padding: 15px; 
            font-size: 13px; 
            text-align: center; 
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* BUTTONS */
        .btn-kirim { 
            width: 100%; 
            margin-top: 20px; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            background: linear-gradient(135deg, #2563eb, #38bdf8); 
            color: white; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: 0.3s; 
        }
        .btn-kirim:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(56,189,248,0.3); }
        .btn-kirim:active { transform: translateY(0); }
        .btn-kirim:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }

        /* LOADING ANIMATION */
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite;}
        @keyframes dots { 0%, 20% { color: transparent; text-shadow: .5em 0 0 transparent, 1em 0 0 transparent; } 40% { color: #38bdf8; text-shadow: .5em 0 0 transparent, 1em 0 0 transparent; } 60% { text-shadow: .5em 0 0 #38bdf8, 1em 0 0 transparent; } 80%, 100% { text-shadow: .5em 0 0 #38bdf8, 1em 0 0 #38bdf8; } }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">
        <i class="fas fa-arrow-left"></i> Kembali ke Menu
    </a>

    <div class="menu-box">
        <h2><i class="fas fa-server"></i> MENU VPS</h2>

        <div class="qris-container">
            <img src="https://files.catbox.moe/1txtmf.jpeg" alt="QRIS Payment">
            <p>SCAN QRIS UNTUK PEMBAYARAN</p>
        </div>

        <form id="vpsOrderForm" onsubmit="event.preventDefault();">
            <label><i class="fas fa-id-card"></i> WhatsApp / Email Tujuan</label>
            <input type="text" id="kontakUser" placeholder="Contoh: 08123456789 atau email@gmail.com" required>

            <label><i class="fas fa-box-open"></i> Pilih Paket VPS</label>
            <select id="paketVps" onchange="updateHargaDisplay()" required>
                <option value="">-- Pilih Paket VPS --</option>
                <option value="1 GB|500">VPS 1 GB - Rp 500</option>
                <option value="2 GB|1000">VPS 2 GB - Rp 1.000</option>
                <option value="3 GB|2000">VPS 3 GB - Rp 2.000</option>
                <option value="4 GB|2500">VPS 4 GB - Rp 2.500</option>
                <option value="Unlimited|7000">VPS Unlimited - Rp 7.000</option>
            </select>

            <div class="harga-tag" id="hargaLabel">Harga: -</div>

            <label><i class="fas fa-receipt"></i> Upload Bukti Pembayaran</label>
            <input type="file" id="fileBukti" accept="image/*" onchange="handlePreview(this)" required>
            <img id="previewBukti" alt="Preview Bukti">

            <div class="status-box" id="statusBox">
                <span style="opacity:0.6">Siap menerima pesanan sistem...</span>
            </div>

            <button type="button" class="btn-kirim" id="btnProses" onclick="prosesOrder()">
                <i class="fas fa-paper-plane"></i> KIRIM PESANAN
            </button>
        </form>
    </div>

    <script>
        let currentHarga = 0;
        let imgBase64 = "";

        // Fungsi Update Label Harga
        function updateHargaDisplay() {
            const val = document.getElementById("paketVps").value;
            const label = document.getElementById("hargaLabel");
            if (val) {
                currentHarga = val.split("|")[1];
                label.innerText = "Harga: Rp " + parseInt(currentHarga).toLocaleString('id-ID');
            } else {
                label.innerText = "Harga: -";
                currentHarga = 0;
            }
        }

        // Fungsi Preview Gambar & Konversi ke Base64
        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const prev = document.getElementById('previewBukti');
                    prev.src = e.target.result;
                    prev.style.display = "block";
                    imgBase64 = e.target.result; 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Fungsi Proses Pesanan
        function prosesOrder() {
            const kontak = document.getElementById("kontakUser").value.trim();
            const paketRaw = document.getElementById("paketVps").value;
            const status = document.getElementById("statusBox");
            const btn = document.getElementById("btnProses");

            if (!kontak || !paketRaw || !imgBase64) {
                status.innerHTML = "<span style='color:#ef4444; font-weight:bold;'><i class='fas fa-times-circle'></i> LENGKAPI SEMUA DATA!</span>";
                return;
            }

            // Animasi Loading
            btn.disabled = true;
            status.innerHTML = "<span class='loading-dots' style='color:#38bdf8; font-weight:bold;'>SEDANG MENGIRIM PESANAN</span>";

            // Simulasi Delay Pengiriman
            setTimeout(() => {
                const orderData = {
                    id_order: "VPS-" + Date.now(),
                    kontak: kontak,
                    paket: paketRaw.split("|")[0],
                    harga: currentHarga,
                    bukti: imgBase64,
                    waktu: new Date().toLocaleString('id-ID')
                };

                // Simpan ke Database Lokal (LocalStorage)
                let listOrder = JSON.parse(localStorage.getItem("vpsOrders")) || [];
                listOrder.push(orderData);
                localStorage.setItem("vpsOrders", JSON.stringify(listOrder));

                // Berhasil
                status.innerHTML = `
                    <div style="color:#10b981; font-weight:bold;">
                        <i class="fas fa-check-circle"></i> PESANAN BERHASIL TERKIRIM!<br>
                        <span style="font-size:11px; color:#94a3b8; font-weight:normal;">Sistem akan segera memproses akun Anda.</span>
                    </div>
                `;

                // Reset Form
                document.getElementById("vpsOrderForm").reset();
                document.getElementById("previewBukti").style.display = "none";
                document.getElementById("hargaLabel").innerText = "Harga: -";
                imgBase64 = "";
                btn.disabled = false;

            }, 2000);
        }
    </script>
</body>
</html>
