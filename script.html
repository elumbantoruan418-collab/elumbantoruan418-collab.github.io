    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.4);

            --card: rgba(23, 32, 53, 0.8);
            --text: #f8fafc;
            --dim: #94a3b8;

        body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); margin: 0; padding: 20px; overflow-x: hidden; }
        #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Header */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-family: 'Plus Jakarta Sans'; font-size: 26px; font-weight: 800; margin: 0; background: linear-gradient(to right, #818cf8, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 11px; color: var(--dim); margin: 5px 0; letter-spacing: 2px; font-weight: 700; }

        /* Search */
        .search-box { max-width: 500px; margin: 0 auto 20px; position: relative; }
        .search-box input { width: 100%; padding: 12px 15px 12px 45px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: var(--card); color: white; outline: none; box-sizing: border-box; backdrop-filter: blur(10px); }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        /* Menu Grid - Scroll Horizontal Aktif */
        .menu-wrapper { display: grid; grid-template-rows: repeat(2, 1fr); grid-auto-flow: column; grid-auto-columns: min-content; gap: 12px; overflow-x: auto; padding: 10px 5px 25px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .menu-wrapper::-webkit-scrollbar { display: none; }

        .card { width: 145px; background: var(--card); padding: 18px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(5px); flex-shrink: 0; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 20px var(--primary-glow); }
        .card i { font-size: 24px; color: var(--primary); margin-bottom: 10px; }
        .card h3 { font-size: 11px; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
        .card .price { font-size: 10px; color: var(--success); font-weight: 800; margin-top: 6px; background: rgba(16, 185, 129, 0.1); padding: 2px 8px; border-radius: 5px; }

        /* Panel Checkout */
        #contentArea { max-width: 480px; margin: 0 auto 50px; }
        .panel { background: var(--card); padding: 25px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .desc-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; font-size: 11px; line-height: 1.8; color: #cbd5e1; margin: 15px 0; border-left: 4px solid var(--primary); font-family: 'JetBrains Mono', monospace; word-wrap: break-word; }
        
        .qris-area { background: white; padding: 15px; border-radius: 18px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .qris-area img { width: 100%; max-width: 170px; border-radius: 8px; }

        label { display: block; font-size: 10px; margin-bottom: 6px; color: var(--dim); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .input-winz { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; font-size: 13px; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .input-winz:focus { border-color: var(--primary); background: rgba(0,0,0,0.5); }

        #previewImg { width: 100%; max-height: 220px; object-fit: contain; border-radius: 12px; display: none; margin-bottom: 15px; border: 2px solid var(--primary); padding: 5px; background: #000; }

        .status-box { background: rgba(0,0,0,0.5); border: 1px dashed var(--primary); border-radius: 12px; padding: 15px; font-size: 12px; text-align: center; margin-bottom: 15px; min-height: 50px; display: flex; align-items: center; justify-content: center; font-weight: 600; }

        .btn-order { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), #6366f1); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1.5px; }
        .btn-order:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 20px var(--primary-glow); }
        .btn-order:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .loading:after { content: ' .'; animation: dots 1s steps(5, end) infinite;}
        @keyframes dots { 0%, 20% { color: transparent; text-shadow: .5em 0 0 transparent, 1em 0 0 transparent; } 40% { color: var(--primary); text-shadow: .5em 0 0 transparent, 1em 0 0 transparent; } 60% { text-shadow: .5em 0 0 var(--primary), 1em 0 0 transparent; } 80%, 100% { text-shadow: .5em 0 0 var(--primary), 1em 0 0 var(--primary); } }
    </style>

        // --- SNOW ANIMATION ---
        const cvs = document.getElementById('snow');
        const ctx = cvs.getContext('2d');
        let dots = [];
        function init() {
            cvs.width = window.innerWidth; cvs.height = window.innerHeight;
            dots = [];
            for(let i=0; i<80; i++) dots.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, r:Math.random()*2, s:Math.random()*0.5+0.2});
        }
        function anim() {
            ctx.clearRect(0,0,cvs.width,cvs.height);
            ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.beginPath();
            dots.forEach(d => { ctx.moveTo(d.x, d.y); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); d.y += d.s; if(d.y > cvs.height) d.y = -5; });
            ctx.fill(); requestAnimationFrame(anim);
        }
        init(); anim(); window.onresize = init;

        function handlePreview(input) {
            const img = document.getElementById('previewImg');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => { 
                    img.src = e.target.result; 
                    img.style.display = 'block'; 
                    imgBase64 = e.target.result;
                    document.getElementById("statusBox").innerHTML = "<b style='color:var(--success)'>BUKTI TERUNGGAH!</b>";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function prosesOrder(name, price) {
            const kontak = document.getElementById("kontakUser").value;
            const status = document.getElementById("statusBox");
            const btn = document.getElementById("btnProses");

            if (!kontak || !imgBase64) {
                status.innerHTML = "<b style='color:var(--error)'>⚠️ LENGKAPI NOMOR & BUKTI!</b>";
                return;
            }

            btn.disabled = true;
            status.innerHTML = "<span class='loading' style='color:var(--primary); font-weight:bold;'>ENCRYPTING & SENDING DATA</span>";

                    waktu: new Date().toLocaleString()
                };
