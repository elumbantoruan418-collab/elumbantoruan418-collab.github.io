<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz // SUPPORT CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --card-bg: #0d0d1a;
            --primary: #38bdf8;
            --instagram: #e1306c;
            --telegram: #0088cc;
            --owner-chat: #facc15;
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: var(--font-display); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Tombol Kembali Pojok Kiri Atas */
        .back-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            z-index: 100;
        }

        .back-nav:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .support-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            position: relative;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
            font-size: 30px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            transform: rotate(-5deg);
        }

        h2 { letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-family: var(--font-mono);
            font-size: 13px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .owner { background: var(--owner-chat); color: #000; }
        .ig { background: #1a1a2e; color: #fff; border: 1px solid var(--instagram); }
        .tg { background: #1a1a2e; color: #fff; border: 1px solid var(--telegram); }

        .btn-link:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .owner:hover { filter: brightness(1.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <a href="index.html" class="back-nav">
        <i class="fas fa-arrow-left"></i> KEMBALI
    </a>

    <div class="support-card">
        <div class="icon-box">
            <i class="fas fa-headset"></i>
        </div>
        <h2>XTR CENTER</h2>
        <p>Butuh bantuan teknis atau info layanan? Hubungi owner atau join channel kami.</p>

        <a href="obrolan.html" class="btn-link owner">
            <i class="fas fa-comment-dots"></i> CHAT OWNER (ONLINE)
        </a>

        <a href="https://www.instagram.com/erwin__shbg" target="_blank" class="btn-link ig">
            <i class="fab fa-instagram"></i> erwin__shbg
        </a>

        <a href="https://t.me/Winz_ofcial" target="_blank" class="btn-link tg">
            <i class="fab fa-telegram-plane"></i> CHANNEL TELEGRAM
        </a>

        <div style="margin-top: 25px; font-size: 10px; opacity: 0.3; font-family: var(--font-mono); letter-spacing: 1px;">
            WINZ PROJECT // INFRASTRUCTURE ACCESS
        </div>
    </div>

</body>
</html>
