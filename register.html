<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz Cloud // Secure Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1; 
            --brand-secondary: #8b5cf6;
            --bg-body: #0f172a; /* Gelap Premium */
            --white: #ffffff;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            background-color: var(--bg-body);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* TOAST ERROR */
        #toast { 
            position: fixed; top: 20px; right: 20px; 
            background: #ef4444; color: white; padding: 16px 24px; border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transform: translateX(150%); transition: 0.5s; z-index: 1000;
        }
        #toast.visible { transform: translateX(0); }

        .auth-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }

        .brand-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 14px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo i { color: white; font-size: 24px; }

        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }

        .form-control {
            width: 100%; padding: 12px 16px 12px 48px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 12px; color: white; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }

        .btn-login {
            width: 100%; padding: 14px; background: var(--brand-primary);
            color: white; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn-login:hover { background: var(--brand-secondary); transform: translateY(-2px); }

        .divider { margin: 25px 0; border-top: 1px solid #334155; position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 0 10px; font-size: 12px; color: #64748b; }

        .btn-register {
            display: block; width: 100%; padding: 12px;
            border: 1px solid #334155; border-radius: 12px;
            color: white; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s;
        }
        .btn-register:hover { background: #334155; }
    </style>
</head>
<body>

<div id="toast">Gagal masuk. Username atau Password salah!</div>

<div class="auth-card">
    <div class="brand-logo">
        <i class="fas fa-terminal"></i>
    </div>
    <h1>Winz Cloud Access</h1>
    <p>Sign in to manage your framework</p>

    <form id="loginForm">
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="form-control" placeholder="Your username" required>
            </div>
        </div>

        <div class="form-group">
            <label>Security Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">Login System</button>

        <div class="divider"><span>ATAU</span></div>

        <a href="register.html" class="btn-register">Buat Akun Baru</a>
    </form>
</div>

<script src="users.js"></script>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userInp = document.getElementById('username').value.trim();
        const passInp = document.getElementById('password').value.trim();

        // Ambil data users dari LocalStorage (yang dikelola users.js)
        const allUsers = JSON.parse(localStorage.getItem("users")) || [];

        // Validasi
        const userFound = allUsers.find(u => u.username === userInp && u.password === passInp);

        if (userFound) {
            // Jika berhasil, simpan session sementara
            localStorage.setItem("currentUser", JSON.stringify(userFound));
            
            // Arahkan ke dashboard (Ganti 'dashboard.html' sesuai filemu)
            alert("Login Berhasil! Selamat datang " + userFound.username);
            window.location.href = "dashboard.html"; 
        } else {
            // Munculkan Toast Error
            const toast = document.getElementById('toast');
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }
    });
</script>

</body>
</html>
