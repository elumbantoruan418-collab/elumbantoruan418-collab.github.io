<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz Cloud // Secure Registration</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1; 
            --brand-secondary: #8b5cf6;
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --text-muted: #94a3b8;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            background-color: var(--bg-body);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent);
        }

        /* TOAST NOTIFICATION */
        #toast { 
            position: fixed; top: 20px; right: 20px; 
            background: #10b981; color: white; padding: 16px 24px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transform: translateX(150%); transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            z-index: 1000; font-weight: 600; display: flex; align-items: center; gap: 10px;
        }
        #toast.visible { transform: translateX(0); }

        /* AUTH CARD */
        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .brand-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 18px; margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        .brand-logo i { color: white; font-size: 26px; }

        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; margin-bottom: 8px; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

        /* FORM STYLING */
        .form-group { text-align: left; margin-bottom: 22px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #475569; transition: 0.3s; }

        .form-control {
            width: 100%; padding: 14px 16px 14px 48px;
            background: var(--input-bg); border: 1px solid #334155;
            border-radius: 14px; color: white; outline: none; transition: 0.3s;
            font-size: 15px;
        }
        .form-control:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        .form-control:focus + i { color: var(--brand-primary); }

        .btn-reg {
            width: 100%; padding: 16px; background: var(--brand-primary);
            color: white; border: none; border-radius: 14px;
            font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s;
            font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-reg:hover { background: var(--brand-secondary); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2); }
        .btn-reg:active { transform: translateY(0); }

        .back-link {
            display: block; margin-top: 25px; color: var(--text-muted);
            text-decoration: none; font-size: 14px; transition: 0.3s;
        }
        .back-link b { color: var(--brand-primary); transition: 0.3s; }
        .back-link:hover b { color: var(--brand-secondary); text-shadow: 0 0 8px rgba(139, 92, 246, 0.4); }
    </style>
</head>
<body>

<div id="toast"><i class="fas fa-check-circle"></i> Akun Berhasil Dibuat!</div>

<div class="auth-card">
    <div class="brand-logo">
        <i class="fas fa-user-plus"></i>
    </div>
    <h1>Create Account</h1>
    <p>Join Winz Cloud Infrastructure</p>

    <form id="regForm">
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="form-control" placeholder="Choose username" required autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <label>Security Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-reg">
            <span>Daftar Sekarang</span>
            <i class="fas fa-arrow-right"></i>
        </button>

        <a href="index.html" class="back-link">Sudah punya akun? <b>Login</b></a>
    </form>
</div>

<script src="users.js"></script>

<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userVal = document.getElementById('username').value.trim();
        const passVal = document.getElementById('password').value.trim();

        // 1. Validasi Engine
        if (typeof UserDB === "undefined") {
            alert("Sistem Error: users.js tidak ditemukan!");
            return;
        }

        // 2. Cek Duplikasi
        if (UserDB.find(userVal)) {
            alert("Username '" + userVal + "' sudah ada, cari yang lain Winz!");
            return;
        }

        // 3. Generate User Data
        const newUser = {
            id: Date.now(),
            username: userVal,
            password: passVal,
            apiKey: "WINZ_" + Math.random().toString(36).substring(2, 12).toUpperCase(),
            role: "USER",
            createdAt: new Date().toISOString().split('T')[0]
        };

        // 4. Save to LocalDB
        UserDB.save(newUser);

        // 5. Success Feedback
        const toast = document.getElementById('toast');
        toast.classList.add('visible');
        
        // Pindah ke Login setelah 1.5 detik
        setTimeout(() => {
            window.location.href = "index.html"; 
        }, 1500);
    });
</script>

</body>
</html>
