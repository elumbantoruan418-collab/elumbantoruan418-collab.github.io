<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz Cloud // Secure Registration</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1; 
            --brand-secondary: #8b5cf6;
            --bg-body: #0f172a;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            background-color: var(--bg-body);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* TOAST SUCCESS */
        #toast { 
            position: fixed; top: 20px; right: 20px; 
            background: #10b981; color: white; padding: 16px 24px; border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transform: translateX(150%); transition: 0.5s; z-index: 1000;
        }
        #toast.visible { transform: translateX(0); }

        .auth-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }

        .brand-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 14px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo i { color: white; font-size: 24px; }

        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }

        .form-control {
            width: 100%; padding: 12px 16px 12px 48px;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 12px; color: white; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }

        .btn-reg {
            width: 100%; padding: 14px; background: var(--brand-primary);
            color: white; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn-reg:hover { background: var(--brand-secondary); transform: translateY(-2px); }

        .back-link {
            display: block; margin-top: 20px; color: #94a3b8;
            text-decoration: none; font-size: 13px; font-weight: 500;
        }
        .back-link b { color: var(--brand-primary); }
    </style>
</head>
<body>

<div id="toast">Akun Berhasil Dibuat! Mengalihkan...</div>

<div class="auth-card">
    <div class="brand-logo">
        <i class="fas fa-user-plus"></i>
    </div>
    <h1>Create Account</h1>
    <p>Join Winz Cloud Infrastructure</p>

    <form id="regForm">
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="username" class="form-control" placeholder="Choose username" required>
            </div>
        </div>

        <div class="form-group">
            <label>Security Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-reg">Daftar Sekarang</button>

        <a href="index.html" class="back-link">Sudah punya akun? <b>Login</b></a>
    </form>
</div>

<script src="users.js"></script>

<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userVal = document.getElementById('username').value.trim();
        const passVal = document.getElementById('password').value.trim();

        // 1. Cek apakah UserDB tersedia (dari users.js)
        if (typeof UserDB === "undefined") {
            alert("Error: File users.js tidak terbaca!");
            return;
        }

        // 2. Cek apakah username sudah ada
        if (UserDB.find(userVal)) {
            alert("Username '" + userVal + "' sudah terdaftar!");
            return;
        }

        // 3. Buat objek user baru sesuai format kamu
        const newUser = {
            id: Date.now(),
            username: userVal,
            password: passVal,
            apiKey: "WINZ_" + Math.random().toString(36).substring(2, 12).toUpperCase(),
            role: "USER",
            createdAt: new Date().toISOString().split('T')[0]
        };

        // 4. Simpan ke database (LocalStorage)
        UserDB.save(newUser);

        // 5. Tampilkan Feedback & Otomatis Balik ke index.html
        const toast = document.getElementById('toast');
        toast.classList.add('visible');
        
        // Jeda 1.5 detik supaya user bisa lihat pesan sukses, lalu pindah
        setTimeout(() => {
            window.location.href = "index.html"; 
        }, 1500);
    });
</script>

</body>
</html>
