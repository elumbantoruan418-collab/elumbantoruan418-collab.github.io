<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winz Cloud // Secure Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1; 
            --brand-secondary: #8b5cf6;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* TOAST NOTIFICATION */
        #toast { 
            position: fixed; top: 20px; right: 20px; 
            background: var(--white); border-left: 4px solid #ef4444;
            color: var(--text-main); padding: 16px 24px; border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; font-weight: 500;
        }
        #toast.visible { transform: translateX(0); }
        #toast.success { border-left-color: #10b981; }

        /* AUTH CARD */
        .auth-container { width: 100%; max-width: 400px; padding: 20px; position: relative; z-index: 10; }
        
        .auth-card {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        
        .brand-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 14px; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.2);
        }
        .brand-logo i { color: white; font-size: 24px; }

        .auth-header h1 { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px; font-weight: 800; color: #0f172a;
            margin-bottom: 6px;
        }
        .auth-header p { color: var(--text-muted); font-size: 13px; }

        /* FORM ELEMENTS */
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; font-size: 12px; font-weight: 700; 
            color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 16px;
        }

        .form-control {
            width: 100%; padding: 12px 16px 12px 48px;
            background-color: #f1f5f9; border: 2px solid transparent;
            border-radius: 12px; font-size: 14px; color: var(--text-main);
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background-color: var(--white);
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        /* ACTIONS */
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(to right, var(--brand-primary), var(--brand-secondary));
            color: white; border: none; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; margin-top: 5px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px rgba(99, 102, 241, 0.2);
        }

        .divider {
            display: flex; align-items: center; text-align: center;
            margin: 20px 0; color: var(--text-muted); font-size: 11px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider span { padding: 0 10px; font-weight: 600; text-transform: uppercase; }

        .btn-register {
            width: 100%; padding: 12px;
            background-color: transparent; color: var(--brand-primary);
            border: 2px solid var(--brand-primary); border-radius: 12px;
            font-size: 13px; font-weight: 700; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: all 0.2s ease;
        }
        .btn-register:hover { background-color: rgba(99, 102, 241, 0.05); }

        .footer-info {
            text-align: center; margin-top: 24px;
            font-size: 11px; color: var(--text-muted); font-weight: 500;
        }
    </style>
</head>
<body>

<div id="toast">
    <i class="fas fa-circle-exclamation"></i>
    <span id="toastMsg">Gagal masuk. Periksa kembali data Anda.</span>
</div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo">
                <i class="fas fa-cloud-bolt"></i>
            </div>
            <h1>Winz Cloud Access</h1>
            <p>Secure authentication for infrastructure</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username / ID</label>
                <div class="input-wrapper">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" name="username" class="form-control" placeholder="Masukkan ID Anda" required>
                </div>
            </div>

            <div class="form-group">
                <label>Security Key</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Execute Access
            </button>

            <div class="divider">
                <span>Registration Area</span>
            </div>

            <a href="register.html" class="btn-register">
                <i class="fas fa-plus"></i> Create New Account
            </a>
        </form>
    </div>
    
    <div class="footer-info">
        Powered by &copy; 2026 Winz XTR Engine.
    </div>
</div>

<script src="users.js"></script>
<script src="admin.js"></script>
<script src="script.js"></script>

<script>
    // Fungsi bantuan untuk toast jika dipanggil dari script.js
    function showToast(msg, type = 'error') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        
        toastMsg.innerText = msg;
        toast.className = type === 'success' ? 'visible success' : 'visible';
        
        setTimeout(() => toast.classList.remove('visible'), 3000);
    }
</script>

</body>
    </html>
