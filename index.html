<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winz Cloud // Secure Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1; 
            --brand-secondary: #8b5cf6;
            --bg-body: #030305;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --card-bg: #0d0d1a;
            --border-color: rgba(99, 102, 241, 0.2);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* TOAST NOTIFIKASI */
        #toast { 
            position: fixed; top: 20px; right: 20px; 
            background: #1e293b; border-left: 4px solid #ef4444;
            color: white; padding: 16px 24px; border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; font-weight: 500;
        }
        #toast.visible { transform: translateX(0); }
        #toast.success { border-left-color: #10b981; }

        .auth-container { width: 100%; max-width: 400px; padding: 20px; z-index: 10; }
        .auth-card {
            background: var(--card-bg); padding: 40px; border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        .brand-logo {
            width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 18px; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
        .brand-logo i { color: white; font-size: 28px; }

        .auth-header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 800; color: white; margin-bottom: 6px; }
        .auth-header p { color: var(--text-muted); font-size: 13px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--brand-primary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #475569; font-size: 16px; }

        .form-control {
            width: 100%; padding: 14px 16px 14px 48px;
            background-color: rgba(15, 23, 42, 0.6); border: 1px solid #1e293b;
            border-radius: 14px; font-size: 14px; color: white; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--brand-primary); outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        .btn-login {
            width: 100%; padding: 16px; background: linear-gradient(to right, var(--brand-primary), var(--brand-secondary));
            color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 5px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(99, 102, 241, 0.3); }

        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #334155; font-size: 10px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1e293b; }
        .divider span { padding: 0 15px; font-weight: 700; text-transform: uppercase; }

        .btn-register {
            width: 100%; padding: 14px; background-color: transparent; color: var(--brand-primary);
            border: 1px solid var(--brand-primary); border-radius: 14px; font-size: 13px; font-weight: 700;
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .btn-register:hover { background-color: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body>

<div id="toast">
    <i id="toastIcon" class="fas fa-circle-exclamation"></i>
    <span id="toastMsg">Gagal masuk. Periksa kembali data Anda.</span>
</div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo"><i class="fas fa-cloud-bolt"></i></div>
            <h1>Winz Cloud</h1>
            <p>XTR Infrastructure Management</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username / ID</label>
                <div class="input-wrapper">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan ID" required>
                </div>
            </div>

            <div class="form-group">
                <label>Security Key</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Execute Access</button>

            <div class="divider"><span>Registration Area</span></div>
            <a href="daftar.html" class="btn-register"><i class="fas fa-plus"></i> DAFTAR AKUN</a>
        </form>
    </div>
</div>

<script src="admin.js"></script> 
<script src="users.js"></script> 

<script>
    function showToast(msg, type = 'error') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');
        
        toastMsg.innerText = msg;
        toastIcon.className = type === 'success' ? 'fas fa-circle-check' : 'fas fa-circle-exclamation';
        toast.className = 'visible' + (type === 'success' ? ' success' : '');
        
        setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userInp = document.getElementById('username').value.trim();
        const passInp = document.getElementById('password').value.trim();
        const btn = document.getElementById('btnLogin');

        btn.innerText = "AUTHENTICATING...";
        btn.style.opacity = "0.7";

        setTimeout(() => {
            // 1. CEK DATA ADMIN (Dari admin.js)
            if (typeof ADMINS !== 'undefined') {
                const isAdmin = ADMINS.find(a => (a.username === userInp || a.id === userInp) && a.password === passInp);
                if (isAdmin) {
                    localStorage.setItem("currentUser", userInp);
                    localStorage.setItem("xtr_session_id", userInp);
                    showToast("Access Granted: Welcome Admin!", "success");
                    setTimeout(() => { window.location.href = "admin.html"; }, 1000);
                    return;
                }
            }

            // 2. CEK DATABASE LOCALSTORAGE (User yang daftar di web)
            const localUsers = JSON.parse(localStorage.getItem("users")) || [];
            const isLocalUser = localUsers.find(u => 
                (u.username === userInp || u.id === userInp) && u.password === passInp
            );

            if (isLocalUser) {
                localStorage.setItem("currentUser", userInp);
                localStorage.setItem("xtr_session_id", userInp);
                showToast("Akses Diterima! Membuka Dashboard...", "success");
                
                // ARAHKAN KE DASHBOARD.HTML
                setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
                return;
            }

            // 3. JIKA GAGAL
            showToast("ACCESS DENIED: ID atau Key Salah!");
            btn.innerText = "Execute Access";
            btn.style.opacity = "1";
        }, 800);
    });
</script>

</body>
</html>
