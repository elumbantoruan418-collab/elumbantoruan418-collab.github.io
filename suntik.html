        // --- SNOW ANIMATION ---
        const cvs = document.getElementById('snow'); const ctx = cvs.getContext('2d'); let dots = [];
        function init() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; dots = []; for(let i=0; i<80; i++) dots.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, r:Math.random()*2, s:Math.random()*0.5+0.2}); }
